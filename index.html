/* ============================================================
   RECURRING ENTRIES
   Posted on launch, never silently in the future.
   ============================================================ */
function runRecurring(){
  const today = todayISO();
  let posted = 0;
  state.recurring.forEach(r => {
    if (!r.active) return;
    let guard = 0;
    while (r.nextDate <= today && guard++ < 60){
      state.transactions.push({
        id:uid(), kind:r.kind, amountMinor:r.amountMinor, date:r.nextDate,
        categoryId:r.categoryId || null, goalId:r.goalId || null,
        title:r.title || '', note:r.note || '', recurringId:r.id,
        createdAt:Date.now(), updatedAt:Date.now()
      });
      r.lastPosted = r.nextDate;
      r.nextDate = addMonthsClamped(r.nextDate, 1);
      posted++;
    }
  });
  if (posted){ save(true); }
  return posted;
}

/* ============================================================
   PIN LOCK  (a deterrent for a lost phone, not encryption)
   ============================================================ */
let lockActive = false;
/* The salt keeps the old identifier on purpose: changing it would stop an
   already-configured PIN from ever matching again. */
async function hashPin(pin){
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kasa|' + pin));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  } catch(e){
    let x = 0; for (const ch of ('kasa|' + pin)) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
    return 'f' + x.toString(16);
  }
}
function togglePin(){
  if (state.settings.pinLock){
    pinEntry('Enter your PIN to turn it off', async (pin) => {
      if (await hashPin(pin) === state.settings.pinHash){
        state.settings.pinLock = false; state.settings.pinHash = null; save(true); render(); toast('PIN removed');
        return true;
      }
      return false;
    });
  } else {
    pinEntry('Choose a 4-digit PIN', async (pin) => {
      pinEntry('Enter it again', async (pin2) => {
        if (pin2 !== pin){ toast('PINs did not match'); return false; }
        state.settings.pinHash = await hashPin(pin);
        state.settings.pinLock = true; save(true); render(); toast('PIN set');
        return true;
      }, true);
      return true;
    }, true);
  }
}
/** onDone(pin) -> Promise<boolean> : true closes the pad. */

      drawDots();
      ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k => {

        if (k) b.onclick = async () => {

          }
        };

      });

  });

}

function downloadFile(name, text, mime){
  try {
    const blob = new Blob([text], {type: mime || 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  } catch(e){ return false; }
}

    'The backup holds ' + data.transactions.length + ' transactions, ' + (data.categories||[]).length + ' categories and ' + (data.goals||[]).length + ' goals. Everything currently in the app is replaced.',

/* ---------- CSV ---------- */
const csvCell = (v) => {
  const s = String(v == null ? '' : v);
  return /[",\n;]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
};
function exportCSV(opts){
  opts = opts || {};
  const cur = state.settings.currency;
  const head = ['date','kind','amount','currency','category','goal','description','note'];
  const lines = [head.join(',')];
  const rows = state.transactions
    .filter(t => (!opts.from || t.date >= opts.from) && (!opts.to || t.date < opts.to))
    .slice()
    .sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  rows.forEach(t => {
    const cat = t.categoryId ? catById(t.categoryId) : null;
    const goal = t.goalId ? goalById(t.goalId) : null;
    lines.push([t.date, t.kind, moneyInput(t.amountMinor), cur, cat ? cat.name : '', goal ? goal.name : '', t.title || '', t.note || ''].map(csvCell).join(','));
  });
  if (!rows.length){ toast('Nothing to export for that period'); return; }
  const name = (opts.name || 'john-money-transactions-' + todayISO()) + '.csv';
  if (downloadFile(name, '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8')) toast('Saved ' + name);
  else alertBox('Download blocked', 'Your browser would not save the file.');
}

function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"' && text[i+1] === '"'){ cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',' || c === ';'){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] || '').trim());
}

function importCSV(){
  sheet({
    title:'Import from CSV', left:'Cancel',

        + '<p style="margin-bottom:0"><code>date</code> as YYYY-MM-DD · <code>kind</code> one of expense, income, savingsDeposit, savingsWithdrawal. '
        + 'Missing categories and goals are created automatically. Rows are <b>added</b> to what you already have.</p></div>'
        + '<input type="file" id="f" accept=".csv,text/csv" style="display:none">'
        + '<button class="btn" id="pick" style="margin-top:16px">Choose a CSV file</button>';
      const f = s.body.querySelector('#f');

        const file = f.files[0]; if (!file) return;
        const r = new FileReader();
        r.onload = () => doImportCSV(String(r.result), s);
        r.readAsText(file);
      };
    }
  });
}

async function doImportCSV(text, s){
  const rows = parseCSV(text);
  if (rows.length < 2){ alertBox('Nothing to import', 'The file has no data rows.'); return; }
  const head = rows[0].map(x => x.trim().toLowerCase());
  const idx = (n) => head.indexOf(n);
  const iDate = idx('date'), iKind = idx('kind'), iAmt = idx('amount');
  if (iDate < 0 || iAmt < 0){ alertBox('Missing columns', 'The file needs at least "date" and "amount" columns.'); return; }
  const iCat = idx('category'), iGoal = idx('goal'), iDesc = idx('description'), iNote = idx('note');

  const added = [], problems = [];
  const findOrMakeCat = (name, type) => {
    if (!name) return null;
    let c = state.categories.find(x => x.type === type && x.name.toLowerCase() === name.toLowerCase());
    if (!c){ c = {id:uid(), name, icon: type === 'income' ? '💰' : '📦', color:'slate', type, isArchived:false, createdAt:Date.now()}; state.categories.push(c); }
    return c.id;
  };
  const findOrMakeGoal = (name) => {
    if (!name) return null;
    let g = state.goals.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!g){ g = {id:uid(), name, targetMinor:0, targetDate:null, icon:'🎯', color:'blue', isArchived:false, createdAt:Date.now()}; state.goals.push(g); }
    return g.id;
  };

  rows.slice(1).forEach((r, n) => {
    const date = (r[iDate] || '').trim().slice(0,10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)){ problems.push('Row ' + (n+2) + ': bad date'); return; }
    const amount = parseMoney(r[iAmt]);
    if (amount == null || amount === 0){ problems.push('Row ' + (n+2) + ': bad amount'); return; }
    let kind = (iKind > -1 ? (r[iKind]||'').trim() : '') || (amount < 0 ? 'expense' : 'income');
    kind = {expense:'expense', income:'income', savingsdeposit:'savingsDeposit', savingswithdrawal:'savingsWithdrawal',
            deposit:'savingsDeposit', withdrawal:'savingsWithdrawal'}[kind.toLowerCase()] || 'expense';
    const catName = iCat > -1 ? (r[iCat]||'').trim() : '';
    const goalName = iGoal > -1 ? (r[iGoal]||'').trim() : '';
    const t = {
      id:uid(), kind, amountMinor: Math.abs(amount), date,
      categoryId: (kind === 'expense' || kind === 'income') ? findOrMakeCat(catName || 'Other', kind === 'income' ? 'income' : 'expense') : null,
      goalId: (kind === 'savingsDeposit' || kind === 'savingsWithdrawal') ? findOrMakeGoal(goalName || 'Savings') : null,
      title: iDesc > -1 ? (r[iDesc]||'').trim() : '',
      note: iNote > -1 ? (r[iNote]||'').trim() : '',
      createdAt:Date.now(), updatedAt:Date.now()
    };
    added.push(t);
  });

  if (!added.length){ alertBox('Nothing imported', problems.slice(0,4).join('\n') || 'No usable rows found.'); return; }
  await snapshotNow('before CSV import');
  const ok = await confirmBox('Import ' + added.length + ' transactions?',
    (problems.length ? problems.length + ' rows will be skipped. ' : '') + 'They are added to your existing data.', 'Import');
  if (!ok) return;
  state.transactions.push(...added);
  save(true);
  if (s) s.close();
  render();
  toast('Imported ' + added.length + ' transactions');
}

async function resetAll(){
  const ok = await confirmBox('Erase all data?', 'Every transaction, category, goal and budget is deleted from this device. This cannot be undone.', 'Erase', true);

/* ============================================================
   AUTOMATIC BACKUP

   Two things happen, and they protect against different disasters.

   1. A RESTORE POINT kept inside the app's own storage, in its own
      IndexedDB record, overwritten each time the schedule fires. This is
      the "one file on the device, overwritten when the backup starts".
      It survives a bad import, an accidental erase, a broken update — the
      failures that actually happen. It does not survive clearing website
      data or losing the phone.

   2. A REAL FILE, where the browser allows it. Desktop Chrome and Edge can
      be given one file once and then write to it for ever after, with no
      further prompting. Safari on iPhone has no such API at all: a web app
      there cannot write a file without a tap. So on iPhone the app keeps
      the restore point, and when a file backup falls due it asks — once —
      with a one-tap save. Pretending otherwise would be the worst kind of
      backup: the sort you think you have.
   ============================================================ */

const AUTO_KEY = 'kasa.autobackup';          // IndexedDB record, see DB_KEY note
const HANDLE_KEY = 'kasa.backupfile';

const FREQS = {
  daily:      {label:'Every day',      days:1},
  weekly:     {label:'Every week',     days:7},
  fortnightly:{label:'Every 2 weeks',  days:14},
  monthly:    {label:'Every month',    days:30}
};

function autoCfg(){
  const s = state.settings;
  if (!s.autoBackup) s.autoBackup = {enabled:true, frequency:'weekly', lastRunAt:null, lastFileAt:null, fileName:null};
  return s.autoBackup;
}
const fileBackupSupported = () => typeof window !== 'undefined' && 'showSaveFilePicker' in window;

function backupDue(){
  const cfg = autoCfg();
  if (!cfg.enabled) return false;
  if (!cfg.lastRunAt) return true;
  const days = (FREQS[cfg.frequency] || FREQS.weekly).days;
  return daysBetween(cfg.lastRunAt, todayISO()) >= days;
}
function nextDueDate(){
  const cfg = autoCfg();
  if (!cfg.lastRunAt) return todayISO();
  return addDays(cfg.lastRunAt, (FREQS[cfg.frequency] || FREQS.weekly).days);
}

function backupPayload(){
  return JSON.stringify({
    app:'john-money', schema:SCHEMA, exportedAt:new Date().toISOString(), data:state
  });
}

/** Overwrite the single restore point held inside the app. */
async function snapshotNow(reason){
  try {
    await idbPut(AUTO_KEY, JSON.stringify({
      savedAt: Date.now(), savedOn: todayISO(), reason: reason || 'scheduled',
      counts: {
        transactions: state.transactions.length,
        categories: state.categories.length,
        goals: state.goals.length,
        notes: state.notes.length
      },
      payload: backupPayload()
    }));
    return true;
  } catch(e){ return false; }
}
async function readSnapshot(){
  try { const raw = await idbGet(AUTO_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}

/* ---------- the real file, where the browser allows one ---------- */
async function chooseBackupFile(){
  if (!fileBackupSupported()){ alertBox('Not available in this browser', 'This browser cannot give a page lasting access to a file. The restore point inside the app still works.'); return; }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: 'john-money-backup.json',
      types: [{description:'John Money backup', accept:{'application/json':['.json']}}]
    });
    await idbPut(HANDLE_KEY, handle);
    autoCfg().fileName = handle.name;
    save(true);
    const ok = await writeBackupFile();
    toast(ok ? 'Backup file set up' : 'File chosen, but writing failed');
    return ok;
  } catch(e){ return false; }   // the person cancelled the picker
}
async function backupFileHandle(){
  try { return (await idbGet(HANDLE_KEY)) || null; } catch(e){ return null; }
}
/** Returns 'ok' | 'needs-permission' | 'none' | 'failed'. */
async function writeBackupFile(){
  const handle = await backupFileHandle();
  if (!handle) return 'none';
  try {
    const opts = {mode:'readwrite'};
    let perm = await handle.queryPermission(opts);
    if (perm === 'prompt') perm = await handle.requestPermission(opts);
    if (perm !== 'granted') return 'needs-permission';
    const w = await handle.createWritable();      // truncates: one file, overwritten
    await w.write(backupPayload());
    await w.close();
    autoCfg().lastFileAt = todayISO();
    save(true);
    return 'ok';
  } catch(e){ return 'failed'; }
}

/** Called at launch. Never blocks, never nags more than once a day. */
async function runAutoBackup(){
  if (!backupDue()) return;
  const cfg = autoCfg();
  await snapshotNow('scheduled');
  cfg.lastRunAt = todayISO();
  save(true);

  const res = await writeBackupFile();
  if (res === 'ok'){ toast('Backup saved'); return; }
  /* No silent file write available — ask, once, rather than pretend. */
  if (cfg.fileName || !fileBackupSupported()) offerManualBackup(res);
}

function offerManualBackup(reason){
  const cfg = autoCfg();
  setTimeout(() => {
    sheet({
      title:'Backup due', left:'Later', right:'Save now',
      build(s){
        s.body.innerHTML =
          '<div class="card pad" style="font-size:14.5px;line-height:1.55;color:var(--text-2)">'
          + '<p style="margin-top:0"><b style="color:var(--text)">A restore point has just been saved inside the app.</b> '
          + 'That covers a bad import or an accidental erase.</p>'
          + '<p style="margin-bottom:0">It does not cover losing the phone or clearing website data. '
          + (reason === 'needs-permission'
              ? 'Your backup file needs permission again — saving now will ask for it.'
              : 'Safari on iPhone cannot write a file on its own, so this one tap is the part only you can do.')
          + ' Choose <b>Save to Files</b> and keep it in iCloud Drive.</p></div>';
      },
      onRight(close){ close(); exportBackup(); }
    });
  }, 1200);
}

    build(s){

        const handle = await backupFileHandle();
        s.body.innerHTML =
          '<button class="fr form-group" id="en" style="width:100%">'
            + '<span style="flex:1;min-width:0"><span class="lab" style="display:block">Automatic backup</span>'

              ? '<div class="section-hd"><h2>How often</h2></div><div class="form-group" id="fq">'
                + Object.keys(FREQS).map(k =>
                    '<button class="fr" data-f="' + k + '"><span class="lab" style="flex:1;min-width:0">' + FREQS[k].label + '</span>'
                    + (cfg.frequency === k ? '<span style="color:var(--accent)">' + ico('check',20) + '</span>' : '') + '</button>').join('')
                + '</div>'
              : '')
          + '<div class="section-hd"><h2>Restore point in the app</h2></div>'
          + '<div class="form-group">'
            + (snap
                ? statRow('Last saved', esc(dayLabel(snap.savedOn)))
                  + statRow('Holds', plural(snap.counts.transactions, 'transaction') + ', ' + plural(snap.counts.notes, 'note'))
                  + (cfg.enabled ? statRow('Next due', esc(dayLabel(nextDueDate()))) : '')
                  + '<button class="fr" id="restore"><span class="lab" style="flex:1;min-width:0;color:var(--accent)">Restore from this point</span>'
                  + '<span class="chev">' + ico('chevR',17) + '</span></button>'
                : '<div class="fr"><span class="lab muted" style="flex:1">No restore point saved yet</span></div>')
            + '<button class="fr" id="now"><span class="lab" style="flex:1;min-width:0;color:var(--accent)">Back up now</span></button>'
          + '</div>'
          + '<div class="section-hd"><h2>Backup file on this device</h2></div>'
          + (fileBackupSupported()
              ? '<div class="form-group">'
                + (handle
                    ? statRow('File', esc(cfg.fileName || 'chosen'))
                      + statRow('Last written', cfg.lastFileAt ? esc(dayLabel(cfg.lastFileAt)) : 'Not yet')
                    : '')
                + '<button class="fr" id="pickfile"><span class="lab" style="flex:1;min-width:0;color:var(--accent)">'
                + (handle ? 'Choose a different file' : 'Choose a file to keep updated') + '</span>'
                + '<span class="chev">' + ico('chevR',17) + '</span></button></div>'
                + '<div class="group-note">The same file is overwritten every time, so it never piles up. This browser can write it without asking again.</div>'
              : '<div class="card pad" style="font-size:14px;line-height:1.5;color:var(--text-2)">'
                + '<p style="margin:0"><b style="color:var(--text)">This browser cannot write a file on its own.</b> '
                + 'Safari on iPhone has no way for a web app to save a file without a tap — so when a backup falls due, '
                + 'the app asks you once and saves it in a single tap. The restore point above is kept automatically either way.</p></div>')
          + '<div class="group-note" style="margin-top:16px">A restore point lives inside the app, so it survives a bad import or an '
          + 'accidental erase — but not clearing website data or losing the phone. Keep a file backup as well for those.</div>';

        s.body.querySelector('#en').onclick = () => {
          cfg.enabled = !cfg.enabled; save(true); haptic(); draw();
        };
        s.body.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
          cfg.frequency = b.dataset.f; save(true); haptic(); draw();
        });
        const now = s.body.querySelector('#now');
        if (now) now.onclick = async () => {
          await snapshotNow('manual');
          cfg.lastRunAt = todayISO(); save(true);
          const res = await writeBackupFile();
          toast(res === 'ok' ? 'Backed up to your file' : 'Restore point saved');
          draw();
        };
        const rst = s.body.querySelector('#restore');
        if (rst) rst.onclick = async () => {
          const ok = await confirmBox('Restore from ' + dayLabel(snap.savedOn) + '?',
            'Everything in the app is replaced with the ' + plural(snap.counts.transactions, 'transaction')
            + ' and ' + plural(snap.counts.notes, 'note') + ' saved then. A restore point of the current data is taken first.',
            'Restore', true);
          if (!ok) return;
          await snapshotNow('before restore');
          applyBackup(snap.payload, s);
        };
        const pf = s.body.querySelector('#pickfile');
        if (pf) pf.onclick = () => chooseBackupFile().then(draw);
      };
      draw();
    }
  });
}

/* ============================================================
   SELF-TESTS — financial logic, dates, money parsing.
   Run from the console:  JM.test()
   ============================================================ */
function runTests(){
  const backup = state;
  const results = [];
  const ok = (name, cond, got) => results.push({name, pass: !!cond, got});
  const eq = (name, a, b) => ok(name, a === b, a + ' vs ' + b);

  /* ---- money parsing ---- */
  eq('parse "24.50" -> 2450', parseMoney('24.50'), 2450);
  eq('parse "24,50" -> 2450', parseMoney('24,50'), 2450);
  eq('parse "1 234,56" -> 123456', parseMoney('1 234,56'), 123456);
  eq('parse "1,234.56" -> 123456', parseMoney('1,234.56'), 123456);
  eq('parse "1.234,56" -> 123456', parseMoney('1.234,56'), 123456);
  eq('parse "12" -> 1200', parseMoney('12'), 1200);
  eq('parse "0.1" -> 10', parseMoney('0.1'), 10);
  eq('parse ".5" -> 50', parseMoney('.5'), 50);
  eq('parse "" -> null', parseMoney(''), null);
  eq('parse "abc" -> null', parseMoney('abc'), null);
  eq('parse "-9.99" -> -999', parseMoney('-9.99'), -999);
  eq('0.1+0.2 exact in minor units', parseMoney('0.1') + parseMoney('0.2'), 30);
  eq('moneyInput(2450)', moneyInput(2450), '24.50');
  eq('moneyInput(5)', moneyInput(5), '0.05');
  eq('moneyInput(100000)', moneyInput(100000), '1000.00');

  /* ---- dates ---- */
  eq('monthShift Dec->Jan', monthShift('2026-12', 1), '2027-01');
  eq('monthShift Jan->Dec', monthShift('2027-01', -1), '2026-12');
  eq('monthShift +14', monthShift('2026-09', 14), '2027-11');
  eq('monthShift -14', monthShift('2026-09', -14), '2025-07');
  eq('daysInMonth Feb 2028 (leap)', daysInMonth('2028-02'), 29);
  eq('daysInMonth Feb 2027', daysInMonth('2027-02'), 28);
  eq('daysInMonth Sep', daysInMonth('2026-09'), 30);
  eq('addMonthsClamped 31 Jan +1', addMonthsClamped('2027-01-31', 1), '2027-02-28');
  eq('addMonthsClamped 31 Jan +1 leap', addMonthsClamped('2028-01-31', 1), '2028-02-29');
  eq('addMonthsClamped 15 Dec +1', addMonthsClamped('2026-12-15', 1), '2027-01-15');
  eq('addDays over month end', addDays('2026-09-30', 1), '2026-10-01');
  eq('addDays over year end', addDays('2026-12-31', 1), '2027-01-01');
  ok('inMonth boundary first day', inMonth('2026-09-01','2026-09'));
  ok('inMonth boundary last day', inMonth('2026-09-30','2026-09'));
  ok('inMonth excludes next month', !inMonth('2026-10-01','2026-09'));
  ok('inMonth excludes prev month', !inMonth('2026-08-31','2026-09'));

  /* ---- calculations on a fixture ---- */
  const s = blankState();
  s.settings.onboarded = true;
  s.categories = [
    {id:'c1', name:'Groceries', icon:'🛒', color:'green', type:'expense', isArchived:false, createdAt:1},
    {id:'c2', name:'Transport', icon:'🚌', color:'blue', type:'expense', isArchived:false, createdAt:2},
    {id:'c3', name:'Salary', icon:'💼', color:'green', type:'income', isArchived:false, createdAt:3}
  ];
  s.goals = [{id:'g1', name:'Holiday', targetMinor:200000, targetDate:null, icon:'🏖️', color:'teal', isArchived:false, createdAt:1}];
  const T = (kind, amt, date, catId, goalId) => ({id:uid(), kind, amountMinor:amt, date, categoryId:catId||null, goalId:goalId||null, title:'', note:'', createdAt:1, updatedAt:1});
  s.transactions = [
    T('income', 280000, '2026-09-01', 'c3'),
    T('expense', 34000, '2026-09-02', 'c1'),
    T('expense', 18000, '2026-09-15', 'c2'),
    T('expense',  2450, '2026-09-30', 'c1'),
    T('savingsDeposit', 10000, '2026-09-10', null, 'g1'),
    T('savingsWithdrawal', 4000, '2026-09-20', null, 'g1'),
    T('expense', 99900, '2026-08-31', 'c1'),          // previous month — must be excluded
    T('expense', 50000, '2026-10-01', 'c1'),          // next month — must be excluded
    T('savingsDeposit', 25000, '2026-08-05', null, 'g1')
  ];
  s.monthlyBudgets['2026-09'] = 200000;
  s.categoryBudgets['2026-09'] = {c1: 40000, c2: 10000};
  state = s;

  eq('expenses Sep', Calc.expenses('2026-09'), 34000 + 18000 + 2450);
  eq('income Sep', Calc.income('2026-09'), 280000);
  eq('deposits Sep', Calc.savedIn('2026-09'), 10000);
  eq('withdrawals Sep', Calc.savedOut('2026-09'), 4000);
  eq('cash flow Sep', Calc.cashFlow('2026-09'), 280000 - 54450 - 10000 + 4000);
  eq('budget remaining Sep', Calc.budgetRemaining('2026-09'), 200000 - 54450);
  ok('savings deposits are NOT spending', Calc.expenses('2026-09') === 54450);
  eq('spent in c1 Sep', Calc.spentInCat('2026-09','c1'), 36450);
  eq('c1 at 91% of its limit is near', Calc.status(Calc.spentInCat('2026-09','c1'), Calc.catLimit('2026-09','c1')), 'near');
  eq('c2 at 180% of its limit is over', Calc.status(Calc.spentInCat('2026-09','c2'), Calc.catLimit('2026-09','c2')), 'over');
  eq('goal balance = deposits - withdrawals (all time)', Calc.goalBalance('g1'), 25000 + 10000 - 4000);
  eq('byCategory ordering', Calc.byCategory('2026-09','expense')[0].id, 'c1');
  eq('byCategory count', Calc.byCategory('2026-09','expense').length, 2);
  eq('prev month expenses', Calc.expenses('2026-08'), 99900);
  eq('next month expenses', Calc.expenses('2026-10'), 50000);
  eq('empty month expenses', Calc.expenses('2026-07'), 0);
  eq('empty month budget is null', Calc.monthBudget('2026-07'), null);
  eq('status exactly at limit is not over', Calc.status(40000, 40000), 'near');
  eq('status just over limit', Calc.status(40001, 40000), 'over');
  eq('status at 85% is near', Calc.status(34000, 40000), 'near');
  eq('status with no limit', Calc.status(1000, null), 'none');

  /* withdrawal cannot exceed balance */
  eq('goal balance before over-withdrawal', Calc.goalBalance('g1'), 31000);
  ok('over-withdrawal would be rejected', 40000 > Calc.goalBalance('g1'));

  /* archived category keeps its history */
  s.categories[0].isArchived = true;
  eq('archived category still totals', Calc.spentInCat('2026-09','c1'), 36450);
  ok('archived category hidden from pickers', !catsOf('expense').some(c => c.id === 'c1'));
  ok('archived category still resolvable', !!catById('c1'));

  /* idempotent seeding */
  const before = state.categories.length;
  ensureDefaultCategories();
  const after1 = state.categories.length;
  ensureDefaultCategories();
  eq('seeding is idempotent', state.categories.length, after1);
  ok('seeding added the missing defaults once', after1 > before);

  /* ---- plural helper ---- */
  eq('plural 1 note', plural(1, 'note'), '1 note');
  eq('plural 2 notes', plural(2, 'note'), '2 notes');
  eq('plural 1 category', plural(1, 'category'), '1 category');
  eq('plural 9 categories', plural(9, 'category'), '9 categories');
  eq('plural respects an explicit form', plural(3, 'entry', 'entries'), '3 entries');
  eq('plural leaves vowel+y alone', plural(2, 'day'), '2 days');

  /* ---- budget suggested from the category limits ---- */
  eq('limits total sums the limits set', Calc.limitsTotal('2026-09').total, 40000 + 10000);
  eq('limits total counts them', Calc.limitsTotal('2026-09').count, 2);
  eq('limits total is zero with no limits', Calc.limitsTotal('2026-07').total, 0);
  eq('limits total ignores a zero limit', (function(){
    state.categoryBudgets['2026-06'] = {c1: 0, c2: 5000};
    return Calc.limitsTotal('2026-06').total;
  })(), 5000);
  eq('limits total ignores a deleted category', (function(){
    state.categoryBudgets['2026-05'] = {gone: 9999, c2: 3000};
    return Calc.limitsTotal('2026-05').total;
  })(), 3000);
  ok('uncovered counts categories with no limit', Calc.uncoveredByLimits('2026-09').count >= 1);
  eq('uncovered is empty when every category has a limit', (function(){
    const all = {};
    catsOf('expense', true).forEach(c => { all[c.id] = 10000; });
    state.categoryBudgets['2026-04'] = all;
    return Calc.uncoveredByLimits('2026-04').count;
  })(), 0);
  delete state.categoryBudgets['2026-06'];
  delete state.categoryBudgets['2026-05'];
  delete state.categoryBudgets['2026-04'];

  /* ---- custom budget month (salary-day periods) ---- */
  const savedStart = state.settings.budgetStartDay;
  state.settings.budgetStartDay = 1;
  eq('start day 1 = calendar month', periodOf('2026-09-01'), '2026-09');
  eq('start day 1 period start', periodStart('2026-09'), '2026-09-01');
  eq('start day 1 period length', daysInPeriod('2026-09'), 30);
  eq('start day 1 label is a month name', monthLabel('2026-09', {month:'long'}).indexOf('–'), -1);

  state.settings.budgetStartDay = 10;
  eq('10th: day before start is the previous period', periodOf('2026-09-09'), '2026-08');
  eq('10th: start day opens the period', periodOf('2026-09-10'), '2026-09');
  eq('10th: last day of the period', periodOf('2026-10-09'), '2026-09');
  eq('10th: next start opens the next period', periodOf('2026-10-10'), '2026-10');
  eq('10th: period start date', periodStart('2026-09'), '2026-09-10');
  eq('10th: period end is exclusive', periodEnd('2026-09'), '2026-10-10');
  eq('10th: period covers 30 days', daysInPeriod('2026-09'), 30);
  eq('10th: Feb period covers 28 days', daysInPeriod('2026-02'), 28);
  eq('10th: Feb period covers 29 in a leap year', daysInPeriod('2028-02'), 29);
  eq('10th: Dec period crosses the year', periodEnd('2026-12'), '2027-01-10');
  eq('10th: January date falls in December period', periodOf('2027-01-05'), '2026-12');
  eq('10th: datesInPeriod length matches', datesInPeriod('2026-09').length, 30);
  eq('10th: first date in period', datesInPeriod('2026-09')[0], '2026-09-10');
  eq('10th: last date in period', datesInPeriod('2026-09')[29], '2026-10-09');
  ok('10th: inMonth spans the month boundary', inMonth('2026-10-05', '2026-09'));
  ok('10th: inMonth excludes the day before', !inMonth('2026-09-09', '2026-09'));
  ok('10th: label shows a date range', monthLabel('2026-09', {month:'long'}).indexOf('–') > -1);

  /* the same fixture, re-bucketed by the new period boundaries */
  eq('10th: Sep period picks up the 30 Sep and 1 Oct expenses',
     Calc.expenses('2026-09'), 2450 + 50000 + 18000);
  eq('10th: Aug period now holds the 2 Sep expense',
     Calc.expenses('2026-08'), 99900 + 34000);
  eq('10th: the 10 Sep deposit opens the Sep period', Calc.savedIn('2026-09'), 10000);
  eq('10th: the 5 Aug deposit falls into the Jul period', Calc.savedIn('2026-07'), 25000);
  eq('10th: nothing left in the Aug period savings', Calc.savedIn('2026-08'), 0);
  eq('10th: withdrawal stays in the Sep period', Calc.savedOut('2026-09'), 4000);
  eq('10th: goal balance is unaffected by periods', Calc.goalBalance('g1'), 31000);
  eq('10th: daily totals cover the period', Calc.dailyTotals('2026-09').length, 30);
  state.settings.budgetStartDay = savedStart;

  /* year boundary */
  state.transactions.push(T('expense', 12345, '2026-12-31', 'c2'), T('expense', 6789, '2027-01-01', 'c2'));
  eq('Dec total', Calc.expenses('2026-12'), 12345);
  eq('Jan total', Calc.expenses('2027-01'), 6789);

  state = backup;
  const failed = results.filter(r => !r.pass);
  const summary = {total: results.length, passed: results.length - failed.length, failed: failed.length, failures: failed};
  if (typeof console !== 'undefined'){
    console.log('%cJohn Money self-test: ' + summary.passed + '/' + summary.total + ' passed',
      'font-weight:bold;color:' + (failed.length ? '#d93b30' : '#1f9d62'));
    failed.forEach(f => console.error('FAIL:', f.name, f.got));
  }
  return summary;
}

/* ============================================================
   BOOT
   ============================================================ */
window.JM = {
  test: runTests, demo: loadDemo,
  get state(){ return state; },
  Calc, parseMoney, fmtMoney
};
window.KASA = window.JM;   // old handle kept working

(async function boot(){
  await load();
  applyTheme();

  const params = new URLSearchParams(location.search);
  if (params.get('demo') === '1' && !state.transactions.length){ loadDemo(); return; }

  if (state.settings.onboarded){
    ensureDefaultCategories();
    runAutoBackup();
    const posted = runRecurring();
    if (posted) setTimeout(() => toast(posted + ' recurring entr' + (posted === 1 ? 'y' : 'ies') + ' added'), 900);
    if (state.settings.pinLock && state.settings.pinHash) lockActive = true;
  }
  ui.month = thisMonth();
  render();

  /* re-lock and refresh the month when the app comes back to the foreground */
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){ hiddenAt = Date.now(); save(true); return; }
    if (state.settings.pinLock && state.settings.pinHash && Date.now() - hiddenAt > 60000 && !lockActive){
      lockActive = true; render(); return;
    }
    if (ui.month !== thisMonth() && !openSheets){
      const t = thisMonth();
      if (monthShift(ui.month, 1) === t){ ui.month = t; }
    }
    runRecurring();
    render();
  });
  window.addEventListener('pagehide', () => save(true));

  /* offline support when the app is served from a folder that also has sw.js */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(() => {});
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading) return;
      reloading = true;
      toast('Updated — reloading');
      setTimeout(() => location.reload(), 900);
    });
  }
})();

</script>
</body>
</html>
