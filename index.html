<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>John Money</title>
<meta name="description" content="A private offline money notebook: budgets, categories, spending limits and savings goals. All data stays on your device.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="John Money">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
  --bg:#f2f2f7; --bg-elev:#ffffff; --card:#ffffff; --card-2:#f7f7fa;
  --text:#000000; --text-2:#6b6b70; --text-3:#9b9ba1;
  --sep:rgba(60,60,67,.16); --sep-strong:rgba(60,60,67,.29);
  --accent:#3b6ef0; --accent-soft:rgba(59,110,240,.12);
  --pos:#1f9d62; --pos-soft:rgba(31,157,98,.12);
  --warn:#c9820f; --warn-soft:rgba(201,130,15,.14);
  --neg:#d93b30; --neg-soft:rgba(217,59,48,.12);
  --track:rgba(120,120,128,.18);
  --sheet:#ffffff; --scrim:rgba(0,0,0,.4);
  --field:#ffffff; --field-2:#eeeef2;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.05);
  --radius:16px; --radius-sm:11px; --radius-lg:22px;
  --tabbar-h:52px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-round:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"],
html[data-theme="auto"] body.dark{
  --bg:#000000; --bg-elev:#1c1c1e; --card:#1c1c1e; --card-2:#2c2c2e;
  --text:#ffffff; --text-2:#a1a1a8; --text-3:#78787f;
  --sep:rgba(84,84,88,.5); --sep-strong:rgba(120,120,128,.6);
  --accent:#4f8bff; --accent-soft:rgba(79,139,255,.18);
  --pos:#3ad483; --pos-soft:rgba(58,212,131,.16);
  --warn:#f0b14a; --warn-soft:rgba(240,177,74,.16);
  --neg:#ff6b5e; --neg-soft:rgba(255,107,94,.16);
  --track:rgba(120,120,128,.28);
  --sheet:#1c1c1e; --scrim:rgba(0,0,0,.6);
  --field:#1c1c1e; --field-2:#2c2c2e;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{background:none;border:0;outline:none}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ============================================================
   App frame
   ============================================================ */
#app{min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.hdr{
  position:sticky;top:0;z-index:30;padding:calc(var(--safe-t) + 8px) 16px 8px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid transparent;transition:border-color .2s;
}
.hdr.stuck{border-bottom-color:var(--sep)}
.hdr-row{display:flex;align-items:center;gap:10px;min-height:38px}
.hdr h1{margin:0;font-family:var(--font-round);font-size:26px;font-weight:800;letter-spacing:-.4px;flex:1}
.hdr-sub{font-size:13px;color:var(--text-2);margin-top:-2px}
.content{flex:1;padding:4px 16px calc(var(--tabbar-h) + var(--safe-b) + 84px)}
.section{margin-top:22px}
.section:first-child{margin-top:8px}
.section-hd{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.section-hd h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.1px;flex:1}
.section-hd .more{font-size:14px;color:var(--accent);font-weight:600}

/* Month switcher */
.monthbar{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.monthbar button{width:30px;height:28px;display:grid;place-items:center;border-radius:999px;color:var(--accent)}
.monthbar button:active{background:var(--accent-soft)}
.monthbar button[disabled]{color:var(--text-3);opacity:.45}
.monthbar .label{min-width:118px;text-align:center;font-size:14px;font-weight:650;letter-spacing:-.1px;padding:0 2px}
.monthbar .label small{display:block;font-size:10px;font-weight:600;color:var(--text-3);letter-spacing:.3px;text-transform:uppercase;line-height:1}

/* ============================================================
   Cards & lists
   ============================================================ */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card.pad{padding:16px}
.rows{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;left:52px;right:0;top:0;height:.5px;background:var(--sep)}
.row.norule + .row::before,.row + .row.norule::before{left:14px}
button.row:active,a.row:active{background:var(--card-2)}
.row .body{flex:1;min-width:0;display:block}
.row .t{display:block;font-size:16px;font-weight:550;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .amt{font-size:16px;font-weight:650;letter-spacing:-.3px;white-space:nowrap}
.row .chev{color:var(--text-3);flex:none}
.icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:none;line-height:1}
.icon.lg{width:38px;height:38px;border-radius:11px;font-size:20px}
.icon.sm{width:22px;height:22px;border-radius:7px;font-size:12px}
.day-hd{font-size:13px;font-weight:700;color:var(--text-2);margin:18px 4px 7px;letter-spacing:-.1px;display:flex}
.day-hd span:last-child{margin-left:auto;font-weight:600;color:var(--text-3)}

/* ============================================================
   Summary / hero card
   ============================================================ */
.hero{padding:18px 18px 16px}
.hero .lead{font-size:13px;font-weight:650;color:var(--text-2);letter-spacing:.2px;text-transform:uppercase}
.hero .big{font-family:var(--font-round);font-size:40px;font-weight:800;letter-spacing:-1.4px;margin:6px 0 2px;line-height:1.05}
.hero .sub{font-size:14px;color:var(--text-2)}
.bar{display:block;height:9px;border-radius:999px;background:var(--track);overflow:hidden;position:relative;margin:13px 0 9px}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .45s cubic-bezier(.2,.9,.25,1)}
.bar.thin{height:6px;margin:7px 0 5px}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text-3);opacity:.55;border-radius:2px}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;letter-spacing:-.1px}
.pill.ok{background:var(--pos-soft);color:var(--pos)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.over{background:var(--neg-soft);color:var(--neg)}
.pill.neutral{background:var(--track);color:var(--text-2)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warnc{color:var(--warn)}.muted{color:var(--text-2)}

/* stat grid */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 14px}
.stat .k{font-size:12px;font-weight:650;color:var(--text-2);letter-spacing:.1px}
.stat .v{font-family:var(--font-round);font-size:21px;font-weight:750;letter-spacing:-.6px;margin-top:3px}
.stat .n{font-size:11.5px;color:var(--text-3);margin-top:2px}

/* ============================================================
   Tab bar + FAB
   ============================================================ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  padding:5px 4px calc(var(--safe-b) + 4px);
  background:color-mix(in srgb,var(--bg-elev) 80%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);
}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-3);padding:2px 0 1px;border-radius:10px}
.tabbar button .lbl{font-size:10px;font-weight:600;letter-spacing:.1px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.fab{
  position:fixed;right:18px;bottom:calc(var(--tabbar-h) + var(--safe-b) + 18px);z-index:41;
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;box-shadow:0 6px 20px rgba(59,110,240,.42);
  transition:transform .14s ease;
}
.fab:active{transform:scale(.92)}

/* ============================================================
   Sheets & modals
   ============================================================ */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .25s;backdrop-filter:blur(1px)}
.scrim.in{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--sheet);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;max-height:94dvh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -8px 40px rgba(0,0,0,.18);
}
.sheet.in{transform:translateY(0)}
@media(min-width:620px){
  .sheet{left:50%;right:auto;transform:translate(-50%,100%);width:560px;border-radius:var(--radius-lg);bottom:16px;max-height:88dvh}
  .sheet.in{transform:translate(-50%,0)}
}
.sheet-hd{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;border-bottom:.5px solid var(--sep);flex:none}
.sheet-hd h3{margin:0;font-size:17px;font-weight:700;flex:1;text-align:center;letter-spacing:-.2px}
.sheet-hd button{font-size:16px;color:var(--accent);font-weight:550;min-width:58px}
.sheet-hd button.strong{font-weight:700;text-align:right}
.sheet-hd button[disabled]{color:var(--text-3);opacity:.5}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--safe-b) + 22px);flex:1}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--sep-strong);margin:7px auto -2px;flex:none}

/* dialog (alerts/confirm) */
.dialog{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);opacity:0;
  width:min(320px,86vw);background:var(--sheet);border-radius:18px;padding:19px 18px 0;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.3);transition:opacity .18s,transform .18s}
.dialog.in{opacity:1;transform:translate(-50%,-50%) scale(1)}
.dialog h4{margin:0 0 6px;font-size:17px;font-weight:700}
.dialog p{margin:0 0 16px;font-size:14px;color:var(--text-2);line-height:1.4}
.dialog .acts{display:flex;margin:0 -18px;border-top:.5px solid var(--sep)}
.dialog .acts button{flex:1;padding:13px 6px;font-size:16px;color:var(--accent);font-weight:550}
.dialog .acts button + button{border-left:.5px solid var(--sep)}
.dialog .acts button.danger{color:var(--neg);font-weight:650}
.dialog .acts button.primary{font-weight:700}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + var(--safe-b) + 84px);transform:translate(-50%,14px);
  background:#1c1c1e;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:70;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:88vw;text-align:center}
:root[data-theme="dark"] .toast,body.dark .toast{background:#e8e8ed;color:#000}
.toast.in{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   Forms
   ============================================================ */
.amount-field{text-align:center;padding:10px 0 4px}
.amount-field .cur{font-family:var(--font-round);font-size:26px;font-weight:700;color:var(--text-2)}
.amount-field input{
  font-family:var(--font-round);font-size:52px;font-weight:800;letter-spacing:-2px;
  width:auto;min-width:1.4ch;max-width:100%;text-align:left;padding:0;background:none;caret-color:var(--accent);
}
.amount-field .inline{display:flex;align-items:baseline;justify-content:center;gap:6px}
.amount-field input::placeholder{color:var(--text-3);opacity:.5}
.seg{display:flex;background:var(--field-2);border-radius:10px;padding:2px;gap:2px;margin:6px 0 14px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:-.1px;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.form-group{background:var(--card);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.fr{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;min-height:46px;width:100%;text-align:left}
.fr + .fr::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--sep)}
.fr .lab{font-size:16px;font-weight:500;flex:none;min-width:88px}
.fr .val{flex:1;text-align:right;color:var(--text-2);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr input[type=text],.fr input[type=number],.fr input[type=date],.fr input[type=password],.fr textarea{flex:1;text-align:right;font-size:16px;min-width:0}
.fr input::placeholder{color:var(--text-3)}
.fr textarea{resize:none;text-align:left;min-height:56px;padding-top:2px}
.fr.col{flex-direction:column;align-items:stretch;gap:6px}
.fr.col .lab{min-width:0;font-size:13px;color:var(--text-2);font-weight:600}
.group-note{font-size:12.5px;color:var(--text-2);margin:-8px 4px 16px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--field-2);
  font-size:14px;font-weight:600;letter-spacing:-.1px;color:var(--text);border:1.5px solid transparent}
.chip[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2.5px solid transparent}
.sw[aria-selected="true"]{border-color:var(--text)}
.sw i{width:24px;height:24px;border-radius:50%;display:block}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.emoji-grid button{height:42px;border-radius:10px;font-size:22px;display:grid;place-items:center;line-height:1}
.emoji-grid button[aria-selected="true"]{background:var(--accent-soft);outline:2px solid var(--accent)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;text-align:center;letter-spacing:-.2px}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.4}
.btn.secondary{background:var(--field-2);color:var(--text)}
.btn.ghost{background:none;color:var(--accent);font-weight:600}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn-row{display:flex;gap:10px}
.switch{position:relative;width:51px;height:31px;border-radius:999px;background:var(--track);flex:none;transition:background .22s}
.switch[aria-checked="true"]{background:var(--pos)}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .22s}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.err{color:var(--neg);font-size:13px;font-weight:600;margin:-8px 4px 14px}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--field-2);border-radius:11px;padding:8px 11px;margin-bottom:12px}
.searchbar input{flex:1;font-size:16px}

.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.daygrid .dayc{aspect-ratio:1;border-radius:10px;background:var(--field-2);font-size:15px;font-weight:600;
  display:grid;place-items:center;font-variant-numeric:tabular-nums}
.daygrid .dayc[aria-selected="true"]{background:var(--accent);color:#fff;font-weight:750}

/* empty state */
.empty{text-align:center;padding:38px 24px;color:var(--text-2)}
.empty .em{font-size:40px;margin-bottom:10px;opacity:.85}
.empty h3{margin:0 0 5px;font-size:16px;font-weight:700;color:var(--text)}
.empty p{margin:0;font-size:14px;line-height:1.45}

/* charts */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{flex:none}
.donut-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.donut-legend .li{display:flex;align-items:center;gap:8px;font-size:13.5px}
.donut-legend .li .dot{width:9px;height:9px;border-radius:3px;flex:none}
.donut-legend .li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut-legend .li .vv{font-weight:650;white-space:nowrap}
.trend{display:flex;align-items:stretch;gap:7px;height:104px;padding:0 2px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.trend .stack{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.trend .b{border-radius:4px;min-height:2px;transition:height .4s}
.trend .lb{font-size:10px;color:var(--text-3);font-weight:600;white-space:nowrap}
.trend .col.cur .lb{color:var(--accent);font-weight:750}

/* onboarding */
.ob{max-width:460px;margin:0 auto;padding:calc(var(--safe-t) + 40px) 22px calc(var(--safe-b) + 28px);min-height:100dvh;display:flex;flex-direction:column}
.ob .mark{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;font-size:40px;background:var(--accent-soft);margin:0 auto 20px}
.ob h1{font-family:var(--font-round);font-size:30px;font-weight:800;letter-spacing:-.8px;text-align:center;margin:0 0 8px}
.ob p.intro{text-align:center;color:var(--text-2);font-size:15px;margin:0 0 26px;line-height:1.45}
.ob .spacer{flex:1;min-height:20px}
.lockpad{display:grid;grid-template-columns:repeat(3,72px);gap:16px;justify-content:center;margin-top:26px}
.lockpad button{height:72px;border-radius:50%;background:var(--field-2);font-family:var(--font-round);font-size:28px;font-weight:600}
.lockpad button:active{background:var(--accent-soft)}
.lockpad button.blank{background:none}
.dots{display:flex;gap:16px;justify-content:center;margin-top:26px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--accent)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.fade-in{animation:fadeIn .22s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
.swipe{position:relative;overflow:hidden;background:var(--neg)}
.swipe .inner{background:var(--card);transition:transform .2s;position:relative;z-index:1}
.swipe .del{position:absolute;right:0;top:0;bottom:0;width:86px;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:650}
/* Wider screens (a PC, or iPhone in landscape): keep one readable column. */
@media (min-width:680px){
  .hdr-row,.hdr-sub,.content{width:100%;max-width:672px;margin-left:auto;margin-right:auto}
  .tabbar{justify-content:center}
  .tabbar button{flex:0 0 104px}
  .fab{right:max(18px,calc(50vw - 336px + 18px))}
}
@media print{.tabbar,.fab{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layers"></div>
<script>
"use strict";
/* ============================================================
   JOHN MONEY — a private, offline budgeting app.
   Single file. No network. No accounts. Data lives on the device.

   Core invariants (see README):
   - Money is ALWAYS an integer number of minor units (grosze/cents).
     Never a float. Parsing happens once, at the input boundary.
   - Dates are ALWAYS "YYYY-MM-DD" strings in the user's local calendar.
     No Date objects are persisted, so no timezone can shift a
     transaction into the wrong month.
   - Savings goal balances are DERIVED from transactions, never stored.
   - Only `expense` transactions count toward spending budgets.
   ============================================================ */

  EUR:{code:'EUR',symbol:'€',locale:'de-DE',name:'Euro'},
  USD:{code:'USD',symbol:'$',locale:'en-US',name:'US dollar'},

/** Parse user text ("24,50", "1 234.5", "12") into integer minor units.
 *  Returns null when the text is not a usable amount. Never uses parseFloat
 *  on the whole string, so 0.1+0.2 style drift cannot occur. */
function parseMoney(text){
  if (text == null) return null;
  let s = String(text).trim().replace(/[ \s']/g, '');
  if (!s) return null;
  s = s.replace(/[^\d.,-]/g, '');
  const neg = /^-/.test(s);
  s = s.replace(/-/g, '');
  const lastDot = s.lastIndexOf('.'), lastCom = s.lastIndexOf(',');
  let dec = '';
  const cut = Math.max(lastDot, lastCom);
  if (cut > -1 && s.length - cut - 1 <= 2 && s.length - cut - 1 > 0) {
    dec = s.slice(cut + 1);
    s = s.slice(0, cut);
  } else if (cut > -1) { s = s.slice(0, cut) + s.slice(cut + 1); }
  s = s.replace(/[.,]/g, '');
  if (!s && !dec) return null;
  if (!/^\d*$/.test(s) || !/^\d*$/.test(dec)) return null;
  const major = s === '' ? 0 : parseInt(s, 10);
  const minor = dec === '' ? 0 : parseInt((dec + '00').slice(0, 2), 10);
  if (!Number.isFinite(major) || major > 1e12) return null;
  const v = major * 100 + minor;
  return neg ? -v : v;
}

function fmtMoney(minor, opts){
  opts = opts || {};
  const cur = CURRENCIES[state.settings.currency] || CURRENCIES.PLN;
  const v = (minor || 0) / 100;
  const nf = new Intl.NumberFormat(cur.locale, {
    style:'currency', currency:cur.code,
    minimumFractionDigits: opts.round ? 0 : 2,
    maximumFractionDigits: opts.round ? 0 : 2
  });
  let out;
  try { out = nf.format(opts.abs ? Math.abs(v) : v); }
  catch(e){ out = (opts.abs ? Math.abs(v) : v).toFixed(opts.round ? 0 : 2) + ' ' + cur.code; }
  if (opts.sign && minor > 0) out = '+' + out;
  return out;
}
/** Plain numeric string for inputs and CSV: "24.50" */
function moneyInput(minor){
  if (minor == null) return '';
  const neg = minor < 0, a = Math.abs(minor);
  return (neg ? '-' : '') + Math.floor(a / 100) + '.' + String(a % 100).padStart(2, '0');
}
const curSymbol = () => (CURRENCIES[state.settings.currency] || CURRENCIES.PLN).symbol;
/** true when the locale writes the symbol before the number ($10) rather than after (10 zł). */
function curSymbolLeads(){
  try {
    const cur = CURRENCIES[state.settings.currency] || CURRENCIES.PLN;
    const s = new Intl.NumberFormat(cur.locale, {style:'currency', currency:cur.code}).format(1);
    return /^[^\d\s]/.test(s.trim());
  } catch(e){ return true; }
}
/** The big amount field, with the symbol on the side the locale expects. */
function amountFieldHTML(id, value, extra){
  const sym = '<span class="cur">' + esc(curSymbol()) + '</span>';
  const inp = '<input id="' + id + '" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Amount" value="' + esc(value || '') + '">';
  return '<div class="amount-field">' + (extra || '') + '<div class="inline">'
    + (curSymbolLeads() ? sym + inp : inp + sym) + '</div></div>';
}

/* ============================================================
   DATES — "YYYY-MM-DD" strings, local calendar, no timezone math

   A "period" is one budget month. Normally it is the calendar month, but
   `settings.budgetStartDay` can move it — set it to 10 and the period keyed
   "2026-09" runs 10 Sep to 9 Oct, because that is when the money arrives.
   Period keys stay "YYYY-MM" (named after the month the period starts in),
   so every budget, limit and report written before this existed keeps working.
   ============================================================ */
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const isoToDate = (iso) => new Date(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10));
function dateToISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(iso, n){ const d = isoToDate(iso); d.setDate(d.getDate()+n); return dateToISO(d); }
const daysBetween = (a, b) => Math.round((isoToDate(b) - isoToDate(a)) / 86400000);
function daysInMonth(mk){ return new Date(+mk.slice(0,4), +mk.slice(5,7), 0).getDate(); }
function monthShift(mk, n){
  let y = +mk.slice(0,4), m = +mk.slice(5,7) - 1 + n;
  y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return y + '-' + String(m+1).padStart(2,'0');
}
/** Add months, clamping the day (31 Jan + 1 month = 28/29 Feb). */
function addMonthsClamped(iso, n){
  const mk = monthShift(iso.slice(0,7), n);
  const day = Math.min(+iso.slice(8,10), daysInMonth(mk));
  return mk + '-' + String(day).padStart(2,'0');
}

/* ---------- budget periods ---------- */
/** 1–28. Capped at 28 so every month has the day; 1 means calendar months. */
function budgetStartDay(){
  const d = state && state.settings ? state.settings.budgetStartDay : 1;
  return clamp(Math.round(Number(d) || 1), 1, 28);
}
const usesCalendarMonths = () => budgetStartDay() === 1;
const periodStart = (pk) => pk + '-' + String(budgetStartDay()).padStart(2,'0');
const periodEnd   = (pk) => periodStart(monthShift(pk, 1));     // exclusive
const periodLast  = (pk) => addDays(periodEnd(pk), -1);
/** Which period does this date belong to? */
function periodOf(iso){
  const mk = iso.slice(0,7);
  return (+iso.slice(8,10)) >= budgetStartDay() ? mk : monthShift(mk, -1);
}
const monthKey  = (iso) => periodOf(iso);
const thisMonth = () => periodOf(todayISO());
const inMonth   = (iso, pk) => periodOf(iso) === pk;
const daysInPeriod = (pk) => daysBetween(periodStart(pk), periodEnd(pk));
function datesInPeriod(pk){
  const out = [];
  let d = periodStart(pk); const stop = periodEnd(pk);
  let guard = 0;
  while (d < stop && guard++ < 70){ out.push(d); d = addDays(d, 1); }
  return out;
}

function monthLabel(pk, opt){
  opt = opt || {month:'long', year:'numeric'};
  if (usesCalendarMonths()){
    return new Date(+pk.slice(0,4), +pk.slice(5,7)-1, 1).toLocaleDateString(undefined, opt);
  }
  const s = periodStart(pk), e = periodLast(pk);
  if (opt.month === 'short') return shortDate(s);
  const range = shortDate(s) + ' – ' + shortDate(e);
  return opt.year ? range + ' ' + e.slice(0,4) : range;
}
const monthShort = (pk) => new Date(+pk.slice(0,4), +pk.slice(5,7)-1, 1).toLocaleDateString(undefined,{month:'short'});

function dayLabel(iso){
  const t = todayISO();
  if (iso === t) return 'Today';
  if (iso === addDays(t, -1)) return 'Yesterday';
  if (iso === addDays(t, 1)) return 'Tomorrow';
  const d = isoToDate(iso);
  const sameYear = iso.slice(0,4) === t.slice(0,4);
  return d.toLocaleDateString(undefined, sameYear
    ? {weekday:'short', day:'numeric', month:'long'}
    : {day:'numeric', month:'long', year:'numeric'});
}
function shortDate(iso){
  return isoToDate(iso).toLocaleDateString(undefined,{day:'numeric',month:'short'});
}

/* ============================================================
   PERSISTENCE
   localStorage is the working store (synchronous, simple).
   IndexedDB holds a mirror, because iOS can evict localStorage
   for sites that are not used for a while. On load we take
   whichever copy is newer, so one surviving store restores the other.
   ============================================================ */
let idb = null;
function openIDB(){
  return new Promise((res) => {
    try {
      const r = indexedDB.open('kasa', 1);   // see DB_KEY — not renamed on purpose
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      setTimeout(() => res(null), 2500);
    } catch(e){ res(null); }
  });
}
function idbGet(key){
  return new Promise((res) => {
    if (!idb) return res(null);
    try {
      const rq = idb.transaction('kv','readonly').objectStore('kv').get(key);
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => res(null);
    } catch(e){ res(null); }
  });
}
function idbPut(key, val){
  return new Promise((res) => {
    if (!idb) return res(false);
    try {
      const tx = idb.transaction('kv','readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    } catch(e){ res(false); }
  });
}

let state = blankState();
let saveTimer = null, saveFailedOnce = false;

function save(immediate){
  state.updatedAt = Date.now();
  clearTimeout(saveTimer);
  const doSave = () => {
    const json = JSON.stringify(state);
    try { localStorage.setItem(DB_KEY, json); }
    catch(e){
      if (!saveFailedOnce){ saveFailedOnce = true; toast('Storage is full — export a backup'); }
    }
    idbPut(DB_KEY, json);
  };
  if (immediate) doSave(); else saveTimer = setTimeout(doSave, 220);
}

function migrate(s){
  if (!s || typeof s !== 'object') return null;
  s.schema = s.schema || 1;
  s.settings = Object.assign(blankState().settings, s.settings || {});
  s.categories = s.categories || []; s.goals = s.goals || [];
  s.noteFolders = s.noteFolders || []; s.notes = s.notes || [];
  s.transactions = s.transactions || []; s.recurring = s.recurring || [];
  s.monthlyBudgets = s.monthlyBudgets || {}; s.categoryBudgets = s.categoryBudgets || {};
  // normalise any legacy Date-ish values to YYYY-MM-DD
  s.transactions.forEach(t => {
    if (t.date && t.date.length > 10) t.date = t.date.slice(0,10);
    t.amountMinor = Math.round(Number(t.amountMinor) || 0);
  });
  s.schema = SCHEMA;
  return s;
}

async function load(){
  idb = await openIDB();
  let local = null, mirror = null;
  try { const raw = localStorage.getItem(DB_KEY); if (raw) local = JSON.parse(raw); } catch(e){}
  try { const raw = await idbGet(DB_KEY); if (raw) mirror = JSON.parse(raw); } catch(e){}
  let best = null;
  if (local && mirror) best = (mirror.updatedAt || 0) > (local.updatedAt || 0) ? mirror : local;
  else best = local || mirror;
  if (best) state = migrate(best) || blankState();
  // keep both stores in step
  if (best) { try { localStorage.setItem(DB_KEY, JSON.stringify(state)); } catch(e){} idbPut(DB_KEY, JSON.stringify(state)); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
}

/* ============================================================
   CALCULATIONS — pure functions, single source of truth.
   Every screen reads numbers from here; no view recomputes money.
   ============================================================ */
const Calc = {
  txInMonth(mk){ return state.transactions.filter(t => inMonth(t.date, mk)); },

  sumKind(mk, kind){
    let s = 0;
    for (const t of state.transactions) if (t.kind === kind && inMonth(t.date, mk)) s += t.amountMinor;
    return s;
  },
  expenses(mk){ return Calc.sumKind(mk, 'expense'); },
  income(mk){ return Calc.sumKind(mk, 'income'); },
  savedIn(mk){ return Calc.sumKind(mk, 'savingsDeposit'); },
  savedOut(mk){ return Calc.sumKind(mk, 'savingsWithdrawal'); },

  /** Income − expenses − deposits + withdrawals. Deliberately NOT "profit". */
  cashFlow(mk){
    return Calc.income(mk) - Calc.expenses(mk) - Calc.savedIn(mk) + Calc.savedOut(mk);
  },

  monthBudget(mk){ const v = state.monthlyBudgets[mk]; return typeof v === 'number' ? v : null; },
  budgetRemaining(mk){
    const b = Calc.monthBudget(mk);
    return b == null ? null : b - Calc.expenses(mk);
  },

  byCategory(mk, type){
    const map = new Map();
    for (const t of state.transactions){
      if (t.kind !== (type || 'expense') || !inMonth(t.date, mk) || !t.categoryId) continue;
      map.set(t.categoryId, (map.get(t.categoryId) || 0) + t.amountMinor);
    }
    return [...map.entries()]
      .map(([id, total]) => ({cat: catById(id), id, total}))
      .filter(r => r.cat)
      .sort((a,b) => b.total - a.total);
  },
  spentInCat(mk, catId){
    let s = 0;
    for (const t of state.transactions)
      if (t.kind === 'expense' && t.categoryId === catId && inMonth(t.date, mk)) s += t.amountMinor;
    return s;
  },
  catLimit(mk, catId){
    const m = state.categoryBudgets[mk];
    return m && typeof m[catId] === 'number' ? m[catId] : null;
  },

  /** Derived, never stored — history and balance cannot disagree. */
  goalBalance(goalId){
    let s = 0;
    for (const t of state.transactions){
      if (t.goalId !== goalId) continue;
      if (t.kind === 'savingsDeposit') s += t.amountMinor;
      else if (t.kind === 'savingsWithdrawal') s -= t.amountMinor;
    }
    return s;
  },
  totalSaved(){ return state.goals.reduce((s,g) => s + Calc.goalBalance(g.id), 0); },

  /** Pace: how far through the budget period we are, 0..1. Current period only. */
  monthProgress(pk){
    if (pk !== thisMonth()) return null;
    const total = daysInPeriod(pk);
    const done = daysBetween(periodStart(pk), todayISO()) + 1;
    return clamp(done / total, 0, 1);
  },
  /** Average daily expense so far this month, projected to month end. */
  projectedSpend(mk){
    const spent = Calc.expenses(mk);
    const p = Calc.monthProgress(mk);
    if (p == null || p <= 0) return null;
    return Math.round(spent / p);
  },
  status(spent, limit){
    if (limit == null || limit <= 0) return 'none';
    const r = spent / limit;
    if (r > 1) return 'over';
    if (r >= 0.85) return 'near';
    return 'ok';
  },
  monthsWithData(){
    const set = new Set(state.transactions.map(t => periodOf(t.date)));
    Object.keys(state.monthlyBudgets).forEach(k => set.add(k));
    set.add(thisMonth());
    return [...set].sort();
  }
};

/* ============================================================
   CALCULATIONS FOR REPORTS
   Same rule as the rest of the app: every number a report shows is
   computed here, not inside a view. Dates are "YYYY-MM-DD" strings,
   so a range is just two strings and `from <= d < to`.
   ============================================================ */
Object.assign(Calc, {

  /* ---------- ranges ---------- */
  monthRange(pk){ return [periodStart(pk), periodEnd(pk)]; },
  /** A "year" is the twelve budget periods labelled y-01 … y-12. */
  yearRange(y){ return [periodStart(y + '-01'), periodStart((Number(y) + 1) + '-01')]; },
  allRange(){
    const dates = state.transactions.map(t => t.date);
    const first = dates.length ? dates.reduce((a, b) => a < b ? a : b) : todayISO();
    return [first, addDays(todayISO(), 1)];
  },
  firstEntryDate(){
    const dates = state.transactions.map(t => t.date);
    return dates.length ? dates.reduce((a, b) => a < b ? a : b) : null;
  },

  txIn(from, to){ return state.transactions.filter(t => t.date >= from && t.date < to); },
  sumIn(kind, from, to){
    let s = 0;
    for (const t of state.transactions)
      if (t.kind === kind && t.date >= from && t.date < to) s += t.amountMinor;
    return s;
  },

  /** Every headline number for a period, in one pass-friendly bundle. */
  summary(from, to){
    const income = Calc.sumIn('income', from, to);
    const expenses = Calc.sumIn('expense', from, to);
    const inSav = Calc.sumIn('savingsDeposit', from, to);
    const outSav = Calc.sumIn('savingsWithdrawal', from, to);
    const netSaved = inSav - outSav;
    return {
      income, expenses, inSav, outSav, netSaved,
      cashFlow: income - expenses - inSav + outSav,
      net: income - expenses,
      /* share of income that ended up in a goal — the standard savings-rate metric */
      savingsRate: income > 0 ? netSaved / income : null,
      count: Calc.txIn(from, to).length
    };
  },

  byCategoryIn(type, from, to){
    const map = new Map();
    for (const t of state.transactions){
      if (t.kind !== type || t.date < from || t.date >= to || !t.categoryId) continue;
      map.set(t.categoryId, (map.get(t.categoryId) || 0) + t.amountMinor);
    }
    return [...map.entries()]
      .map(([id, total]) => ({id, cat: catById(id), total}))
      .filter(r => r.cat)
      .sort((a, b) => b.total - a.total);
  },

  topExpenses(from, to, n){
    return state.transactions
      .filter(t => t.kind === 'expense' && t.date >= from && t.date < to)
      .sort((a, b) => b.amountMinor - a.amountMinor)
      .slice(0, n || 5);
  },

  /** One entry per day of the budget period, zeros included. */
  dailyTotals(pk){
    const out = datesInPeriod(pk).map(date => ({date, total: 0}));
    const index = new Map(out.map((d, i) => [d.date, i]));
    for (const t of state.transactions){
      if (t.kind !== 'expense') continue;
      const i = index.get(t.date);
      if (i !== undefined) out[i].total += t.amountMinor;
    }
    return out;
  },
  /** Days already elapsed that had no expense at all. Past months count in full. */
  noSpendDays(pk){
    const days = Calc.dailyTotals(pk);
    const today = todayISO();
    const scope = pk < thisMonth() ? days : days.filter(d => d.date <= today);
    return {count: scope.filter(d => d.total === 0).length, of: scope.length};
  },

  /** Monday-first, because that is how the week reads in Europe. */
  weekdayTotals(from, to){
    const sums = [0,0,0,0,0,0,0], counts = [0,0,0,0,0,0,0];
    for (const t of state.transactions){
      if (t.kind !== 'expense' || t.date < from || t.date >= to) continue;
      const wd = (isoToDate(t.date).getDay() + 6) % 7;
      sums[wd] += t.amountMinor; counts[wd]++;
    }
    return sums.map((total, i) => ({i, total, count: counts[i]}));
  },

  /** [{mk, income, expenses, netSaved, net}] for a list of month keys. */
  monthlySeries(months){
    return months.map(mk => {
      const [f, t] = Calc.monthRange(mk);
      const s = Calc.summary(f, t);
      return {mk, income: s.income, expenses: s.expenses, netSaved: s.netSaved, net: s.net};
    });
  },
  monthsOfYear(y){
    const out = [];
    for (let m = 1; m <= 12; m++) out.push(y + '-' + String(m).padStart(2,'0'));
    return out;
  },
  yearsWithData(){
    const set = new Set(state.transactions.map(t => periodOf(t.date).slice(0,4)));
    set.add(thisMonth().slice(0,4));
    return [...set].sort();
  },

  /** Running total of income − expenses, month by month. Not net worth: it is
   *  everything that has passed through since tracking began. */
  cumulativeNet(){
    const months = Calc.allMonths();
    let running = 0;
    return months.map(mk => {
      const [f, t] = Calc.monthRange(mk);
      running += Calc.sumIn('income', f, t) - Calc.sumIn('expense', f, t);
      return {mk, value: running};
    });
  },
  allMonths(){
    const first = Calc.firstEntryDate();
    if (!first) return [thisMonth()];
    const out = [];
    let mk = periodOf(first);
    const last = thisMonth() > mk ? thisMonth() : mk;
    let guard = 0;
    while (mk <= last && guard++ < 600){ out.push(mk); mk = monthShift(mk, 1); }
    return out;
  },

  /** How one category behaved across a list of months. */
  categorySeries(catId, months){
    return months.map(mk => ({mk, total: Calc.spentInCat(mk, catId), limit: Calc.catLimit(mk, catId)}));
  },

  /** Was this category's limit realistic? Months with no limit are ignored. */
  limitRecord(catId, months){
    let withLimit = 0, exceeded = 0, overSum = 0;
    const actuals = [];
    months.forEach(mk => {
      const lim = Calc.catLimit(mk, catId);
      const sp = Calc.spentInCat(mk, catId);
      actuals.push(sp);
      if (lim == null) return;
      withLimit++;
      if (sp > lim){ exceeded++; overSum += sp - lim; }
    });
    const sorted = actuals.filter(a => a > 0).sort((a, b) => a - b);
    const median = sorted.length ? sorted[Math.floor(sorted.length / 2)] : 0;
    return {
      withLimit, exceeded, avgOver: exceeded ? Math.round(overSum / exceeded) : 0,
      median,
      /* a limit that would have held in most of those months, rounded to a tidy figure */
      suggestion: median ? Math.ceil(median * 1.1 / 5000) * 5000 : 0
    };
  },

  /** Sum of the category limits set for this period. */
  limitsTotal(pk){
    const m = state.categoryBudgets[pk];
    if (!m) return {total: 0, count: 0};
    let total = 0, count = 0;
    Object.keys(m).forEach(id => {
      const cat = catById(id);
      if (!cat || typeof m[id] !== 'number' || m[id] <= 0) return;
      total += m[id]; count++;
    });
    return {total, count};
  },

  /** Expense categories with no limit this period, and what typically goes
   *  through them — the gap between "total of my limits" and a real budget. */
  uncoveredByLimits(pk){
    const limited = state.categoryBudgets[pk] || {};
    const months = [1, 2, 3].map(i => monthShift(pk, -i));
    let typical = 0, count = 0;
    catsOf('expense', true).forEach(cat => {
      if (typeof limited[cat.id] === 'number' && limited[cat.id] > 0) return;
      const avg = Math.round(months.reduce((s, mk) => s + Calc.spentInCat(mk, cat.id), 0) / months.length);
      if (avg > 0){ typical += avg; count++; }
      else if (!cat.isArchived) count++;
    });
    return {typical, count};
  },

  /** Overall budget track record across a list of months. */
  budgetRecord(months){
    let withBudget = 0, under = 0, diffSum = 0;
    months.forEach(mk => {
      const b = Calc.monthBudget(mk);
      if (b == null || b <= 0) return;
      if (mk === thisMonth()) return;            // the current month is not finished
      withBudget++;
      const diff = b - Calc.expenses(mk);
      diffSum += diff;
      if (diff >= 0) under++;
    });
    return {withBudget, under, avgDiff: withBudget ? Math.round(diffSum / withBudget) : 0};
  },

  /** Average net monthly contribution to a goal over the months it existed. */
  goalContribRate(goalId, lookback){
    const months = [];
    for (let i = (lookback || 6); i >= 1; i--) months.push(monthShift(thisMonth(), -i));
    let total = 0, active = 0;
    months.forEach(mk => {
      const [f, t] = Calc.monthRange(mk);
      let m = 0;
      for (const tx of state.transactions){
        if (tx.goalId !== goalId || tx.date < f || tx.date >= t) continue;
        m += tx.kind === 'savingsDeposit' ? tx.amountMinor : tx.kind === 'savingsWithdrawal' ? -tx.amountMinor : 0;
      }
      if (m !== 0) active++;
      total += m;
    });
    return {perMonth: Math.round(total / months.length), activeMonths: active, months: months.length};
  },

  /** When the goal lands at the rate actually being contributed. */
  goalProjection(goalId){
    const g = goalById(goalId);
    if (!g) return null;
    const bal = Calc.goalBalance(goalId);
    const remaining = g.targetMinor - bal;
    if (remaining <= 0) return {done: true};
    const rate = Calc.goalContribRate(goalId, 6).perMonth;
    if (rate <= 0) return {done: false, rate: 0, monthsLeft: null, etaMonth: null};
    const monthsLeft = Math.ceil(remaining / rate);
    const etaMonth = monthShift(thisMonth(), monthsLeft);
    let vsTarget = null;
    if (g.targetDate){
      const targetMk = g.targetDate.slice(0,7);
      const diff = (Number(etaMonth.slice(0,4)) * 12 + Number(etaMonth.slice(5,7)))
                 - (Number(targetMk.slice(0,4)) * 12 + Number(targetMk.slice(5,7)));
      vsTarget = diff;                              // + = late, − = early, 0 = on time
    }
    return {done: false, rate, monthsLeft, etaMonth, vsTarget, remaining};
  },

  /** Active repeating entries, with what they cost over a year. */
  commitments(){
    return state.recurring
      .filter(r => r.active)
      .map(r => ({
        rule: r,
        label: r.title || (r.categoryId && catById(r.categoryId) ? catById(r.categoryId).name
               : r.goalId && goalById(r.goalId) ? goalById(r.goalId).name : KIND_META[r.kind].label),
        monthly: r.amountMinor,
        yearly: r.amountMinor * 12
      }))
      .sort((a, b) => b.monthly - a.monthly);
  },

  /** Categories with an expense in every one of the given months — the part of
   *  spending that shows up whatever you do. */
  alwaysOnCategories(months){
    return catsOf('expense', true)
      .map(cat => {
        const totals = months.map(mk => Calc.spentInCat(mk, cat.id));
        const present = totals.filter(t => t > 0).length;
        return {cat, present, of: months.length, avg: Math.round(totals.reduce((a,b) => a+b, 0) / months.length)};
      })
      .filter(r => r.present === r.of && r.avg > 0)
      .sort((a, b) => b.avg - a.avg);
  }
});

/* ============================================================
   THEME
   ============================================================ */
function isDark(){
  const t = state.settings.theme;
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(){
  const dark = isDark();
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.body.classList.toggle('dark', dark);
  const m = document.querySelector('meta[name=theme-color]:not([media])');
  if (m) m.setAttribute('content', dark ? '#000000' : '#f2f2f7');
}
if (window.matchMedia) {
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (state.settings.theme === 'system') { applyTheme(); render(); }
  }); } catch(e){}
}

/* ============================================================
   OVERLAYS — toast, dialog, sheet
   ============================================================ */
let toastTimer = null;
function toast(msg){
  let el = $('#toast');
  if (!el){ el = h('<div class="toast" id="toast" role="status" aria-live="polite"></div>'); $('#layers').appendChild(el); }
  el.textContent = msg;
  requestAnimationFrame(() => el.classList.add('in'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('in'); }, 2200);
}

function dialog(opts){
  return new Promise((resolve) => {
    const scrim = h('<div class="scrim"></div>');
    const acts = (opts.actions || [{label:'OK', value:true, primary:true}]);
    const d = h('<div class="dialog" role="alertdialog" aria-modal="true">'
      + '<h4>' + esc(opts.title || '') + '</h4>'
      + (opts.message ? '<p>' + esc(opts.message) + '</p>' : '<p></p>')
      + '<div class="acts">' + acts.map((a,i) =>
          '<button data-i="' + i + '" class="' + (a.primary ? 'primary ' : '') + (a.danger ? 'danger' : '') + '">' + esc(a.label) + '</button>').join('')
      + '</div></div>');
    const close = (v) => {
      scrim.classList.remove('in'); d.classList.remove('in');
      setTimeout(() => { scrim.remove(); d.remove(); }, 200);
      resolve(v);
    };
    d.querySelectorAll('.acts button').forEach(b =>
      b.onclick = () => { haptic(); close(acts[+b.dataset.i].value); });
    scrim.onclick = () => close(opts.dismissValue !== undefined ? opts.dismissValue : false);
    $('#layers').append(scrim, d);
    requestAnimationFrame(() => { scrim.classList.add('in'); d.classList.add('in'); });
  });
}
const alertBox   = (title, message) => dialog({title, message, actions:[{label:'OK', value:true, primary:true}]});
const confirmBox = (title, message, okLabel, danger) => dialog({
  title, message,
  actions:[{label:'Cancel', value:false}, {label:okLabel || 'OK', value:true, primary:true, danger:!!danger}]
});

let openSheets = 0;
/** build(sheetEl, close) fills the body; returns {close}. */
function sheet(opts){
  const scrim = h('<div class="scrim"></div>');
  const el = h('<div class="sheet" role="dialog" aria-modal="true">'
    + '<div class="grabber"></div>'
    + '<div class="sheet-hd">'
      + '<button class="left">' + esc(opts.left || 'Cancel') + '</button>'
      + '<h3>' + esc(opts.title || '') + '</h3>'
      + '<button class="right strong">' + esc(opts.right || '') + '</button>'
    + '</div>'
    + '<div class="sheet-body"></div></div>');
  if (!opts.right) el.querySelector('.right').style.visibility = 'hidden';
  let closed = false;
  const close = (result) => {
    if (closed) return; closed = true;
    openSheets--;
    scrim.classList.remove('in'); el.classList.remove('in');
    setTimeout(() => { scrim.remove(); el.remove(); }, 320);
    if (opts.onClose) opts.onClose(result);
  };
  el.querySelector('.left').onclick = () => { haptic(); (opts.onLeft ? opts.onLeft(close) : close(null)); };
  const rightBtn = el.querySelector('.right');
  rightBtn.onclick = () => { haptic(); if (opts.onRight) opts.onRight(close); };
  scrim.onclick = () => { if (opts.dismissible !== false) close(null); };
  $('#layers').append(scrim, el);
  openSheets++;
  requestAnimationFrame(() => { scrim.classList.add('in'); el.classList.add('in'); });
  const api = {
    el, close,
    body: el.querySelector('.sheet-body'),
    setRight(label, enabled){
      rightBtn.textContent = label;
      rightBtn.style.visibility = label ? 'visible' : 'hidden';
      rightBtn.disabled = enabled === false;
    },
    setTitle(t){ el.querySelector('h3').textContent = t; }
  };
  if (opts.build) opts.build(api);
  return api;
}

/* A simple "pick one from a list" sheet. */
function pickerSheet(title, items, selectedId, onPick, extraHtml){
  return sheet({
    title, left:'Cancel',
    build(s){
      s.body.innerHTML =
        (extraHtml || '') +
        '<div class="rows">' + items.map(it =>
          '<button class="row" data-id="' + esc(it.id) + '">'
          + (it.icon !== undefined
              ? '<span class="icon" style="background:' + softOf(it.color) + '">' + esc(it.icon) + '</span>'
              : '')
          + '<span class="body"><span class="t">' + esc(it.name) + '</span>'
          + (it.sub ? '<span class="s">' + esc(it.sub) + '</span>' : '') + '</span>'
          + (it.id === selectedId ? '<span style="color:var(--accent)">' + ico('check',20) + '</span>' : '')
          + '</button>').join('') + '</div>';
      s.body.querySelectorAll('.row[data-id]').forEach(b => b.onclick = () => {
        haptic(); onPick(b.dataset.id); s.close();
      });
      s.body.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { s.close(); onPick(null, b.dataset.act); });
    }
  });
}

/* ============================================================
   ROUTER / RENDER
   ============================================================ */
const ui = {
  tab: 'dashboard',
  month: thisMonth(),
  year: String(new Date().getFullYear()),
  reportPeriod: 'month',
  txFilter: {kind:'all', catId:null, goalId:null, q:''},
  noteFolder: null,
  noteQuery: '',
  budgetView: 'month',
  scrollMemo: {}
};

const TABS = [
  {id:'dashboard',    label:'Home',    icon:'home'},
  {id:'budget',       label:'Budget',  icon:'wallet'},
  {id:'transactions', label:'Activity',icon:'list'},
  {id:'savings',      label:'Savings', icon:'target'},
  {id:'notes',        label:'Notes',   icon:'note'},
  {id:'reports',      label:'Reports', icon:'chart'},
  {id:'settings',     label:'Settings',icon:'gear'}
];

function go(tab){
  if (ui.tab === tab){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  if (ui.tab === 'notes'){ ui.noteQuery = ''; }
  ui.scrollMemo[ui.tab] = window.scrollY;
  ui.tab = tab;
  haptic();
  render();
  window.scrollTo(0, ui.scrollMemo[tab] || 0);
}

function render(){
  applyTheme();
  const app = $('#app');
  if (!state.settings.onboarded){ renderOnboarding(app); return; }
  if (lockActive){ renderLock(app); return; }

  const screen = h('<div class="screen"></div>');
  const views = {
    dashboard: viewDashboard, budget: viewBudget,
    transactions: viewTransactions, savings: viewSavings,
    notes: viewNotes, reports: viewReports, settings: viewSettings
  };
  screen.appendChild(views[ui.tab]());
  screen.appendChild(tabBar());
  if (ui.tab !== 'settings' && ui.tab !== 'reports') screen.appendChild(fabBtn());
  app.replaceChildren(screen);
  bindStickyHeader();
}

function tabBar(){
  const el = h('<nav class="tabbar" role="tablist"></nav>');
  TABS.forEach(t => {
    const b = h('<button role="tab" aria-selected="' + (ui.tab === t.id) + '" aria-label="' + t.label + '">'
      + ico(t.icon, 23, ui.tab === t.id ? 2.1 : 1.8)
      + '<span class="lbl">' + t.label + '</span></button>');
    b.onclick = () => go(t.id);
    el.appendChild(b);
  });
  return el;
}
function fabBtn(){
  const notes = ui.tab === 'notes';
  const b = h('<button class="fab" aria-label="' + (notes ? 'New note' : 'Add transaction') + '">' + ico('plus', 27, 2.4) + '</button>');
  b.onclick = () => { haptic(12); notes ? editNote(null) : addChooser(); };
  return b;
}
function bindStickyHeader(){
  const hdr = $('.hdr');
  if (!hdr) return;
  const onScroll = () => hdr.classList.toggle('stuck', window.scrollY > 6);
  onScroll();
  window.onscroll = onScroll;
}

/** Standard screen header with optional month switcher. */
function header(title, opts){
  opts = opts || {};
  const el = h('<header class="hdr"><div class="hdr-row"></div></header>');
  const row = el.querySelector('.hdr-row');
  row.appendChild(h('<h1>' + esc(title) + '</h1>'));
  if (opts.month) row.appendChild(monthSwitcher());
  if (opts.right) row.appendChild(opts.right);
  if (opts.sub) el.appendChild(h('<div class="hdr-sub">' + esc(opts.sub) + '</div>'));
  return el;
}
function monthSwitcher(){
  const el = h('<div class="monthbar">'
    + '<button aria-label="Previous month">' + ico('chevL',17,2.3) + '</button>'
    + '<div class="label"></div>'
    + '<button aria-label="Next month">' + ico('chevR',17,2.3) + '</button></div>');
  const lab = el.querySelector('.label');
  const isNow = ui.month === thisMonth();
  lab.innerHTML = '<small>' + (isNow ? 'This month' : (ui.month > thisMonth() ? 'Upcoming' : 'Past')) + '</small>'
    + esc(monthLabel(ui.month, {month:'long', year: ui.month.slice(0,4) === thisMonth().slice(0,4) ? undefined : 'numeric'}));
  const [prev, next] = el.querySelectorAll('button');
  prev.onclick = () => { ui.month = monthShift(ui.month, -1); haptic(); render(); };
  next.onclick = () => { ui.month = monthShift(ui.month, 1); haptic(); render(); };
  lab.onclick = () => { if (!isNow){ ui.month = thisMonth(); haptic(); render(); } };
  return el;
}

function emptyState(emoji, title, text, actionLabel, onAction){
  const el = h('<div class="empty"><div class="em">' + emoji + '</div>'
    + '<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p></div>');

const plural = (n, one, many) => {
  if (n === 1) return n + ' ' + one;
  if (many) return n + ' ' + many;
  /* "category" -> "categories", not "categorys" */
  return n + ' ' + (/[^aeiou]y$/.test(one) ? one.slice(0, -1) + 'ies' : one + 's');
};

/** Auto-size a big amount input so the currency symbol hugs the number.
 *  Measured with a mirror span, because `ch` units lie in a rounded font. */
function autosizeAmount(input){
  const mirror = document.createElement('span');
  const cs = getComputedStyle(input);
  mirror.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0;'
    + 'font-family:' + cs.fontFamily + ';font-size:' + cs.fontSize + ';font-weight:' + cs.fontWeight
    + ';letter-spacing:' + cs.letterSpacing;
  document.body.appendChild(mirror);
  const fit = () => {
    mirror.textContent = input.value || input.placeholder || '0';
    input.style.width = Math.max(28, mirror.offsetWidth + 4) + 'px';
  };
  input.addEventListener('input', fit);
  requestAnimationFrame(fit);
  fit();
  const obs = new MutationObserver(() => { if (!input.isConnected){ mirror.remove(); obs.disconnect(); } });
  obs.observe(document.body, {childList:true, subtree:true});
  return fit;
}

/** Amounts can be blurred for over-the-shoulder privacy. */
function money(minor, opts){
  const txt = fmtMoney(minor, opts);
  if (!state.settings.hideAmounts) return esc(txt);
  return '<span style="filter:blur(7px);user-select:none">' + esc(txt) + '</span>';
}

/* ============================================================
   CHARTS (inline SVG, no libraries)
   ============================================================ */
function donutSVG(slices, size, thickness){
  size = size || 112; thickness = thickness || 19;
  const r = (size - thickness) / 2, cx = size/2, C = 2 * Math.PI * r;
  const total = slices.reduce((s,x) => s + x.value, 0);
  let off = 0, segs = '';
  if (total > 0){
    slices.forEach(s => {
      const len = (s.value / total) * C;
      if (len <= 0.3) return;
      segs += '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + s.color
        + '" stroke-width="' + thickness + '" stroke-dasharray="' + (len - 1.4).toFixed(2) + ' ' + (C - len + 1.4).toFixed(2)
        + '" stroke-dashoffset="' + (-off).toFixed(2) + '" stroke-linecap="butt"></circle>';
      off += len;
    });
  }
  return '<svg class="donut" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" '
    + 'style="transform:rotate(-90deg)" role="img" aria-hidden="true">'
    + '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="' + thickness + '"></circle>'
    + segs + '</svg>';
}

function trendChart(months){
  const data = months.map(mk => ({mk, exp: Calc.expenses(mk), inc: Calc.income(mk)}));
  const max = Math.max(1, ...data.map(d => Math.max(d.exp, d.inc)));
  return '<div class="trend">' + data.map(d => {
    const cur = d.mk === ui.month;
    return '<div class="col' + (cur ? ' cur' : '') + '">'
      + '<div class="stack" style="flex-direction:row;align-items:flex-end;gap:3px">'
        + '<div class="b" style="flex:1;height:' + clamp(d.inc/max*100, d.inc?4:0, 100) + '%;background:var(--pos);opacity:' + (cur?1:.5) + '"></div>'
        + '<div class="b" style="flex:1;height:' + clamp(d.exp/max*100, d.exp?4:0, 100) + '%;background:var(--neg);opacity:' + (cur?1:.5) + '"></div>'
      + '</div>'
      + '<div class="lb">' + esc(monthShort(d.mk)) + '</div></div>';
  }).join('') + '</div>';
}

function paceNote(mk, budget, spent){
  const p = Calc.monthProgress(mk);
  if (p == null) return esc(spent > budget ? fmtMoney(spent - budget) + ' over budget' : 'Month closed');
  const expected = budget * p;
  const diff = Math.round(expected - spent);
  if (spent > budget) return '<span class="neg">' + money(spent - budget) + ' over budget</span>';
  if (diff >= 0) return '<span class="pos">' + money(diff) + ' ahead of pace</span>';
  return '<span class="warnc">' + money(-diff) + ' above pace</span>';
}
function remainingDaysNote(pk){
  if (pk !== thisMonth()) return monthLabel(pk, {month:'long', year:'numeric'});
  const left = daysBetween(todayISO(), periodEnd(pk));
  return left + (left === 1 ? ' day left' : ' days left');
}

function sortTx(a, b){
  if (a.date !== b.date) return a.date < b.date ? 1 : -1;
  return (b.createdAt || 0) - (a.createdAt || 0);
}

function txRow(t, showDate){
  const meta = KIND_META[t.kind];
  const cat = t.categoryId ? catById(t.categoryId) : null;
  const goal = t.goalId ? goalById(t.goalId) : null;
  const icon = cat ? cat.icon : goal ? goal.icon : meta.icon;
  const color = cat ? cat.color : goal ? goal.color : meta.color;
  const title = t.title || (cat ? cat.name : goal ? goal.name : meta.label);
  const subParts = [];
  if (t.title && cat) subParts.push(cat.name);
  if (t.title && goal) subParts.push(goal.name);
  if (!t.title && goal) subParts.push(meta.label);
  if (showDate) subParts.push(shortDate(t.date));
  if (cat && cat.isArchived) subParts.push('archived');
  const signed = meta.sign > 0 ? t.amountMinor : -t.amountMinor;
  const cls = t.kind === 'income' ? 'pos' : t.kind === 'savingsWithdrawal' ? 'warnc' : t.kind === 'savingsDeposit' ? 'muted' : '';
  const row = h('<button class="row">'
    + '<span class="icon" style="background:' + softOf(color) + '">' + esc(icon) + '</span>'
    + '<span class="body"><span class="t">' + esc(title) + '</span>'
    + (subParts.length ? '<span class="s">' + esc(subParts.join(' · ')) + '</span>' : '') + '</span>'
    + '<span class="amt tnum ' + cls + '">' + money(signed, {sign:true}) + '</span></button>');
  row.onclick = () => openTxSheet({edit:t});
  return row;
}

function goalRow(g){
  const bal = Calc.goalBalance(g.id);
  const pct = g.targetMinor > 0 ? clamp(Math.round(bal / g.targetMinor * 100), 0, 999) : 0;
  const done = g.targetMinor > 0 && bal >= g.targetMinor;
  const row = h('<button class="row" style="align-items:flex-start">'
    + '<span class="icon lg" style="background:' + softOf(g.color) + '">' + esc(g.icon) + '</span>'
    + '<span class="body"><span class="t" style="display:flex;gap:8px;align-items:center">' + esc(g.name)
    + (done ? '<span class="pill ok">Goal reached</span>' : '') + '</span>'
    + '<span class="bar thin"><i style="width:' + clamp(pct,0,100) + '%;background:' + colorOf(g.color) + '"></i></span>'
    + '<span class="s tnum">' + money(bal) + ' of ' + money(g.targetMinor) + ' · ' + pct + '%</span></span></button>');
  row.onclick = () => openGoalDetail(g.id);
  return row;
}

function viewBudget(){
  const mk = ui.month;
  const wrap = h('<div style="flex:1;display:flex;flex-direction:column"></div>');
  wrap.appendChild(header('Budget', {month:true}));
  const c = h('<main class="content fade-in"></main>');

  const budget = Calc.monthBudget(mk);
  const spent = Calc.expenses(mk);
  const prevMk = monthShift(mk, -1);
  const prevBudget = Calc.monthBudget(prevMk);
  const prevCatBudgets = state.categoryBudgets[prevMk];

  /* Offer to copy last month's setup — never automatic. */
  if (budget == null && (prevBudget != null || (prevCatBudgets && Object.keys(prevCatBudgets).length))){
    const b = h('<div class="card pad" style="margin-bottom:14px;display:flex;gap:12px;align-items:center">'
      + '<span style="color:var(--accent)">' + ico('info',22) + '</span>'
      + '<div style="flex:1;font-size:14px;line-height:1.35">Copy the budget setup from ' + esc(monthLabel(prevMk,{month:'long'})) + '?</div>'
      + '<button class="btn" style="width:auto;padding:8px 14px;font-size:14px">Copy</button></div>');
    b.querySelector('button').onclick = async () => {
      if (prevBudget != null) state.monthlyBudgets[mk] = prevBudget;
      if (prevCatBudgets) state.categoryBudgets[mk] = Object.assign({}, prevCatBudgets);
      save(true); toast('Budget copied'); render();
    };
    c.appendChild(b);
  }

  /* Monthly budget card */
  const remaining = budget == null ? null : budget - spent;
  const pct = budget ? clamp(Math.round(spent / budget * 100), 0, 999) : 0;
  const st = Calc.status(spent, budget);
  const mcard = h('<section class="card hero" style="margin-bottom:6px">'
    + '<div style="display:flex;align-items:center;gap:10px">'
      + '<div class="lead" style="flex:1">Monthly budget</div>'
      + '<button class="pill neutral" style="gap:4px">' + ico('edit',13,2) + (budget == null ? 'Set' : 'Edit') + '</button></div>'
    + '<div class="big tnum">' + (budget == null ? '—' : money(budget)) + '</div>'
    + (budget != null
        ? '<div class="bar"><i style="width:' + clamp(pct,0,100) + '%;background:' + (st==='over'?'var(--neg)':st==='near'?'var(--warn)':'var(--accent)') + '"></i></div>'
          + '<div class="legend"><span>' + money(spent) + ' spent</span><span class="' + (remaining<0?'neg':'') + '">'
          + (remaining < 0 ? money(-remaining) + ' over' : money(remaining) + ' left') + '</span></div>'
        : '<div class="sub" style="margin-top:6px">Set a limit to track how much is left to spend this month.</div>')
    + '</section>');
  mcard.querySelector('button').onclick = () => editMonthlyBudget();
  c.appendChild(mcard);
  c.appendChild(h('<div class="group-note" style="margin:8px 4px 0">Only expenses count toward the budget. Money moved into savings is not spending.</div>'));

  /* Category limits */
  const cats = catsOf('expense');
  const rowsSec = h('<section class="section"><div class="section-hd"><h2>Category limits</h2>'
    + '<button class="more">Manage</button></div><div class="rows"></div></section>');
  const rows = rowsSec.querySelector('.rows');
  const withLimit = [], withoutLimit = [];
  cats.forEach(cat => {
    const lim = Calc.catLimit(mk, cat.id);
    const sp = Calc.spentInCat(mk, cat.id);
    (lim != null ? withLimit : withoutLimit).push({cat, lim, sp});
  });
  withLimit.sort((a,b) => (b.sp/Math.max(1,b.lim)) - (a.sp/Math.max(1,a.lim)));
  withoutLimit.sort((a,b) => b.sp - a.sp);

  const mkRow = ({cat, lim, sp}) => {
    const s = Calc.status(sp, lim);
    const pc = lim ? clamp(Math.round(sp/lim*100), 0, 999) : 0;
    const note = lim == null
      ? (sp ? fmtMoney(sp) + ' spent · no limit' : 'No limit set')
      : (sp > lim ? fmtMoney(sp - lim) + ' over limit'
         : sp === lim ? 'Limit of ' + fmtMoney(lim) + ' used up'
         : fmtMoney(lim - sp) + ' left of ' + fmtMoney(lim));
    const r = h('<button class="row" style="align-items:flex-start">'
      + '<span class="icon" style="background:' + softOf(cat.color) + '">' + esc(cat.icon) + '</span>'
      + '<span class="body"><span class="t" style="display:flex;align-items:center;gap:8px">' + esc(cat.name)
      + (s === 'over' ? '<span class="pill over">Over</span>'
         : (s === 'near' && sp === lim) ? '<span class="pill warn">Limit reached</span>'
         : s === 'near' ? '<span class="pill warn">Near limit</span>' : '')
      + '</span>'
      + (lim != null ? '<span class="bar thin"><i style="width:' + clamp(pc,0,100) + '%;background:'
          + (s==='over'?'var(--neg)':s==='near'?'var(--warn)':colorOf(cat.color)) + '"></i></span>' : '')
      + '<span class="s tnum">' + (state.settings.hideAmounts ? '•••' : esc(note)) + '</span></span>'
      + '<span class="amt tnum" style="align-self:center">' + (lim != null ? money(sp) : (sp ? money(sp) : '')) + '</span>'
      + '</button>');
    r.onclick = () => editCategoryLimit(cat);
    return r;
  };
  if (!cats.length) rows.appendChild(emptyState('🏷️','No expense categories','Add categories in Settings to start setting limits.'));
  withLimit.forEach(x => rows.appendChild(mkRow(x)));
  if (withoutLimit.length){
    rowsSec.appendChild(h('<div class="section-hd" style="margin-top:18px"><h2 style="color:var(--text-2);font-size:13px">No limit</h2></div>'));
    const r2 = h('<div class="rows"></div>');
    withoutLimit.forEach(x => r2.appendChild(mkRow(x)));
    rowsSec.appendChild(r2);
  }
  rowsSec.querySelector('.more').onclick = () => manageCategories();
  c.appendChild(rowsSec);

  /* Trend */
  const months = [];
  for (let i = 5; i >= 0; i--) months.push(monthShift(mk, -i));
  const avg = Math.round(months.slice(0,5).reduce((s,m) => s + Calc.expenses(m), 0) / 5);
  const diff = spent - avg;
  const tsec = h('<section class="section"><div class="section-hd"><h2>Last 6 months</h2></div>'
    + '<div class="card pad">' + trendChart(months)
    + '<div style="display:flex;gap:16px;margin-top:12px;font-size:12.5px;color:var(--text-2)">'
    + '<span style="display:flex;align-items:center;gap:6px"><i style="width:9px;height:9px;border-radius:3px;background:var(--pos);display:inline-block"></i>Income</span>'
    + '<span style="display:flex;align-items:center;gap:6px"><i style="width:9px;height:9px;border-radius:3px;background:var(--neg);display:inline-block"></i>Expenses</span></div>'
    + (avg > 0 ? '<div style="margin-top:12px;padding-top:12px;border-top:.5px solid var(--sep);font-size:13.5px;color:var(--text-2)">'
        + 'Spending ' + monthLabel(mk,{month:'long'}) + ' is <b class="' + (diff>0?'neg':'pos') + '">'
        + (diff >= 0 ? fmtMoney(diff) + ' higher' : fmtMoney(-diff) + ' lower') + '</b> than the 5-month average of ' + fmtMoney(avg) + '.</div>' : '')
    + '</div></section>');
  c.appendChild(tsec);

  wrap.appendChild(c);
  return wrap;
}

  const activeCat = ui.txFilter.catId ? catById(ui.txFilter.catId) : null;
  const fr = h('<div class="chips" style="margin-bottom:14px"></div>');
  const catChip = h('<button class="chip" aria-selected="' + (!!activeCat) + '">' + ico('filter',15,2)
    + (activeCat ? esc(activeCat.icon + ' ' + activeCat.name) : 'Category') + '</button>');
  catChip.onclick = () => {
    if (activeCat){ ui.txFilter.catId = null; render(); return; }
    const items = state.categories.filter(x => !x.isArchived || txHasCat(x.id))
      .map(x => ({id:x.id, name:x.name, icon:x.icon, color:x.color, sub: x.type === 'income' ? 'Income' : undefined}));
    pickerSheet('Filter by category', items, ui.txFilter.catId, (id) => { ui.txFilter.catId = id; render(); });
  };
  fr.appendChild(catChip);
  if (ui.txFilter.kind !== 'all' || ui.txFilter.catId || ui.txFilter.q){
    const clr = h('<button class="chip">Clear filters</button>');
    clr.onclick = () => { ui.txFilter = {kind:'all', catId:null, goalId:null, q:''}; render(); };
    fr.appendChild(clr);
  }
  c.appendChild(fr);

  c.appendChild(buildTxList());
  wrap.appendChild(c);
  return wrap;
}

function filteredTx(){
  const mk = ui.month, f = ui.txFilter;
  const q = f.q.trim().toLowerCase();
  return state.transactions.filter(t => {
    if (!inMonth(t.date, mk)) return false;
    if (f.kind === 'expense' && t.kind !== 'expense') return false;
    if (f.kind === 'income' && t.kind !== 'income') return false;
    if (f.kind === 'savings' && t.kind !== 'savingsDeposit' && t.kind !== 'savingsWithdrawal') return false;
    if (f.catId && t.categoryId !== f.catId) return false;
    if (f.goalId && t.goalId !== f.goalId) return false;
    if (q){
      const cat = t.categoryId ? catById(t.categoryId) : null;
      const goal = t.goalId ? goalById(t.goalId) : null;
      const hay = [t.title, t.note, cat && cat.name, goal && goal.name, moneyInput(t.amountMinor)]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort(sortTx);
}

function buildTxList(){
  const el = h('<div id="txlist"></div>');
  const list = filteredTx();
  if (!list.length){
    const anyThisMonth = Calc.txInMonth(ui.month).length > 0;
    el.appendChild(h('<div class="card"></div>'));
    el.querySelector('.card').appendChild(
      anyThisMonth
        ? emptyState('🔍','Nothing matches','Try a different filter or search term.','Clear filters',
            () => { ui.txFilter = {kind:'all',catId:null,goalId:null,q:''}; render(); })
        : emptyState('📄','No activity in ' + monthLabel(ui.month,{month:'long'}),'Tap + to add an expense, income, or a savings transfer.',
            'Add a transaction', () => addChooser()));
    return el;
  }
  /* group by day */
  const groups = new Map();
  list.forEach(t => { if (!groups.has(t.date)) groups.set(t.date, []); groups.get(t.date).push(t); });
  let totalExp = 0, totalInc = 0;
  list.forEach(t => { if (t.kind === 'expense') totalExp += t.amountMinor; if (t.kind === 'income') totalInc += t.amountMinor; });
  el.appendChild(h('<div class="card pad" style="display:flex;gap:18px;padding:12px 14px;margin-bottom:4px">'
    + '<div style="flex:1"><div style="font-size:11.5px;font-weight:650;color:var(--text-2)">SHOWING</div>'
    + '<div class="tnum" style="font-weight:700">' + plural(list.length, 'item') + '</div></div>'
    + '<div><div style="font-size:11.5px;font-weight:650;color:var(--text-2);text-align:right">EXPENSES</div>'
    + '<div class="tnum" style="font-weight:700;text-align:right">' + money(totalExp) + '</div></div>'
    + '<div><div style="font-size:11.5px;font-weight:650;color:var(--text-2);text-align:right">INCOME</div>'
    + '<div class="tnum pos" style="font-weight:700;text-align:right">' + money(totalInc) + '</div></div></div>'));

  groups.forEach((items, date) => {
    const dayTotal = items.reduce((s,t) => s + KIND_META[t.kind].sign * t.amountMinor, 0);
    el.appendChild(h('<div class="day-hd"><span>' + esc(dayLabel(date)) + '</span>'
      + '<span class="tnum">' + (dayTotal ? money(dayTotal, {sign:true}) : '') + '</span></div>'));
    const rows = h('<div class="rows"></div>');
    items.forEach(t => rows.appendChild(swipeable(txRow(t, false), t)));
    el.appendChild(rows);
  });
  return el;
}

/** Wrap a row so a left swipe reveals Delete. Falls back to the edit sheet. */
function swipeable(rowEl, t){
  const wrap = h('<div class="swipe"></div>');
  const del = h('<div class="del">' + ico('trash',18) + '</div>');
  const inner = h('<div class="inner"></div>');
  inner.appendChild(rowEl);
  wrap.append(del, inner);
  let x0 = 0, y0 = 0, dx = 0, engaged = false, open = false;
  const setX = (v) => { inner.style.transform = 'translateX(' + v + 'px)'; };
  inner.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; engaged = false;
    inner.style.transition = 'none';
  }, {passive:true});
  inner.addEventListener('touchmove', (e) => {
    const nx = e.touches[0].clientX - x0, ny = e.touches[0].clientY - y0;
    if (!engaged){
      if (Math.abs(nx) > 12 && Math.abs(nx) > Math.abs(ny) * 1.5) engaged = true;
      else if (Math.abs(ny) > 10) { engaged = false; return; }
      else return;
    }
    dx = clamp(nx + (open ? -86 : 0), -110, 0);
    setX(dx);
  }, {passive:true});
  inner.addEventListener('touchend', () => {
    inner.style.transition = 'transform .2s';
    if (!engaged) return;
    open = dx < -44;
    setX(open ? -86 : 0);
  });
  del.onclick = async () => {
    haptic(18);
    const ok = await confirmBox('Delete transaction?', 'This removes it permanently.', 'Delete', true);
    if (ok) deleteTx(t.id); else { inner.style.transition='transform .2s'; setX(0); open = false; }
  };
  return wrap;
}
