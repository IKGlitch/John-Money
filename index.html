/** Grouped income/expense bars for a list of {mk, income, expenses}. */
function monthBars(series, opts){
  opts = opts || {};
  const max = Math.max(1, ...series.map(d => Math.max(d.income, d.expenses)));
  /* average over months that actually have activity — empty future months
     would otherwise drag the line down and make it meaningless */
  const active = series.filter(d => d.income || d.expenses);
  const avg = opts.avgLine && active.length
    ? active.reduce((s,d) => s + d.expenses, 0) / active.length : null;
  const cols = series.map(d => {
    const cur = d.mk === (opts.highlight || '');
    const future = d.mk > thisMonth();
    return '<div class="col' + (cur ? ' cur' : '') + '" data-mk="' + d.mk + '">'
      + '<div class="stack" style="flex-direction:row;align-items:flex-end;gap:2px;opacity:' + (future ? .3 : 1) + '">'
        + '<div class="b" style="flex:1;height:' + clamp(d.income/max*100, d.income ? 3 : 0, 100) + '%;background:var(--pos);opacity:' + (cur ? 1 : .55) + '"></div>'
        + '<div class="b" style="flex:1;height:' + clamp(d.expenses/max*100, d.expenses ? 3 : 0, 100) + '%;background:var(--neg);opacity:' + (cur ? 1 : .55) + '"></div>'
      + '</div>'
      + '<div class="lb">' + esc(opts.shortLabels ? monthShort(d.mk).slice(0,1) : monthShort(d.mk)) + '</div></div>';
  }).join('');
  return '<div class="trend" style="height:' + (opts.height || 120) + 'px;position:relative">'
    + (avg ? '<div style="position:absolute;left:0;right:0;bottom:' + (18 + (avg/max) * ((opts.height || 120) - 18 - 4)) + 'px;'
        + 'border-top:1.5px dashed var(--text-3);opacity:.7"></div>' : '')
    + cols + '</div>';
}

/** Month grid, Monday first, shaded by how much was spent that day. */
function calendarHeat(pk){
  const days = Calc.dailyTotals(pk);
  const max = Math.max(1, ...days.map(d => d.total));
  const firstWd = (isoToDate(days[0].date).getDay() + 6) % 7;
  const today = todayISO();
  let cells = '';
  for (let i = 0; i < firstWd; i++) cells += '<div></div>';
  days.forEach(d => {
    const future = d.date > today;
    const ratio = d.total / max;
    const bg = d.total === 0
      ? 'var(--track)'
      : colorMixAccent(0.18 + ratio * 0.72);
    cells += '<div title="' + esc(shortDate(d.date) + ' · ' + fmtMoney(d.total)) + '" '
      + 'style="aspect-ratio:1;border-radius:7px;background:' + (future ? 'transparent' : bg)
      + ';display:grid;place-items:center;font-size:10px;font-weight:650;'
      + 'color:' + (d.total > 0 && ratio > 0.5 ? '#fff' : 'var(--text-2)') + ';'
      + (future ? 'opacity:.35;border:1px dashed var(--sep);' : '')
      + (d.date === today ? 'outline:2px solid var(--accent);outline-offset:1px;' : '')
      + '">' + (+d.date.slice(8,10)) + '</div>';
  });
  return '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px">'
    + ['M','T','W','T','F','S','S'].map(x => '<div style="text-align:center;font-size:10px;font-weight:700;color:var(--text-3)">' + x + '</div>').join('')
    + '</div>'
    + '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">' + cells + '</div>';
}
function colorMixAccent(a){
  const c = isDark() ? '79,139,255' : '59,110,240';
  return 'rgba(' + c + ',' + a.toFixed(2) + ')';
}

/** Cumulative line, drawn in a fixed viewBox and stretched to fit. */
function lineChart(points, opts){
  opts = opts || {};
  if (points.length < 2) return '<div class="muted" style="font-size:13px;padding:10px 0">Not enough history yet.</div>';
  const W = 300, H = 90;
  const vals = points.map(p => p.value);
  const min = Math.min(0, ...vals), max = Math.max(1, ...vals);
  const x = i => (i / (points.length - 1)) * W;
  const y = v => H - ((v - min) / (max - min || 1)) * H;
  const path = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.value).toFixed(1)).join(' ');
  const area = path + ' L' + W + ' ' + H + ' L0 ' + H + ' Z';
  const zeroY = y(0);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" width="100%" height="' + (opts.height || 90) + '" role="img" aria-hidden="true">'
    + '<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + colorMixAccent(0.34) + '"/><stop offset="100%" stop-color="' + colorMixAccent(0) + '"/></linearGradient></defs>'
    + (min < 0 ? '<line x1="0" y1="' + zeroY.toFixed(1) + '" x2="' + W + '" y2="' + zeroY.toFixed(1)
        + '" stroke="var(--sep-strong)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="3 3"/>' : '')
    + '<path d="' + area + '" fill="url(#lg)"/>'
    + '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>'
    + '</svg>';
}

/** Change against a comparison figure, with direction judged per metric. */
function deltaChip(cur, prev, higherIsBetter){
  if (prev === 0 || prev == null) return '<span class="pill neutral">new</span>';
  const pct = Math.round((cur - prev) / Math.abs(prev) * 100);
  if (pct === 0) return '<span class="pill neutral">same</span>';
  const up = pct > 0;
  const good = higherIsBetter ? up : !up;
  return '<span class="pill ' + (good ? 'ok' : 'over') + '">' + (up ? '▲' : '▼') + ' ' + Math.abs(pct) + '%</span>';
}

function statRow(label, value, cls, note){
  return '<div class="fr"><span class="lab" style="flex:1;min-width:0;font-weight:500">' + label + '</span>'
    + '<span class="val tnum ' + (cls || '') + '" style="font-weight:650' + (cls ? '' : ';color:var(--text)') + '">' + value + '</span></div>'
    + (note ? '<div style="padding:0 14px 9px;font-size:12px;color:var(--text-2);margin-top:-6px">' + note + '</div>' : '');
}

function viewReports(){
  const wrap = h('<div style="flex:1;display:flex;flex-direction:column"></div>');

  const c = h('<main class="content fade-in"></main>');

  /* period switcher */

    + '</div>');
  seg.querySelectorAll('button').forEach(b => b.onclick = () => { ui.reportPeriod = b.dataset.p; haptic(); render(); });
  c.appendChild(seg);

  if (ui.reportPeriod === 'month'){
    c.appendChild(stepper(monthLabel(ui.month, {month:'long', year:'numeric'}),
      () => { ui.month = monthShift(ui.month, -1); render(); },
      () => { ui.month = monthShift(ui.month, 1); render(); }));

  } else if (ui.reportPeriod === 'year'){
    c.appendChild(stepper(ui.year,
      () => { ui.year = String(Number(ui.year) - 1); render(); },
      () => { ui.year = String(Number(ui.year) + 1); render(); }));

  } else {

  }

  /* deep dives */

    ['🔁','Fixed commitments','What repeats every month, and its yearly cost', () => reportCommitments()],
    ['🎯','Savings forecast','When each goal lands at your actual pace', () => reportSavingsForecast()],
    ['📐','Are your limits realistic?','How often each limit held, and what would have', () => reportLimits()],
    ['📅','Spending by weekday','Which days your money actually goes out', () => reportWeekday()]
  ].forEach(([icon, title, sub, fn]) => {
    const r = h('<button class="row"><span class="icon" style="background:var(--field-2)">' + icon + '</span>'
      + '<span class="body"><span class="t">' + title + '</span><span class="s">' + sub + '</span></span>'
      + '<span class="chev">' + ico('chevR',17) + '</span></button>');

    rows.appendChild(r);

function stepper(label, onPrev, onNext){
  const el = h('<div style="display:flex;align-items:center;gap:8px;margin:2px 0 16px">'
    + '<button class="pill neutral" style="padding:7px 10px" aria-label="Previous">' + ico('chevL',15,2.4) + '</button>'
    + '<div style="flex:1;text-align:center;font-family:var(--font-round);font-size:19px;font-weight:750;letter-spacing:-.3px">' + esc(label) + '</div>'
    + '<button class="pill neutral" style="padding:7px 10px" aria-label="Next">' + ico('chevR',15,2.4) + '</button></div>');
  const [p, n] = el.querySelectorAll('button');
  p.onclick = () => { haptic(); onPrev(); };
  n.onclick = () => { haptic(); onNext(); };
  return el;
}

function emptyPeriod(c, what){
  const card = h('<div class="card"></div>');
  card.appendChild(emptyState('📊', 'Nothing to report', 'No entries recorded for ' + what + ' yet.'));
  c.appendChild(card);
}

/* ---------- MONTH ---------- */
function reportMonth(c){
  const mk = ui.month;
  const [from, to] = Calc.monthRange(mk);
  const s = Calc.summary(from, to);
  if (s.count === 0){ emptyPeriod(c, monthLabel(mk, {month:'long', year:'numeric'})); return; }

  const prevMk = monthShift(mk, -1);
  const [pf, pt] = Calc.monthRange(prevMk);
  const prev = Calc.summary(pf, pt);
  const last3 = [1,2,3].map(i => monthShift(mk, -i));
  const avg3 = Math.round(last3.reduce((a, m) => a + Calc.expenses(m), 0) / 3);

  /* headline */
  c.appendChild(h('<section class="card hero">'
    + '<div class="lead">Spent in ' + esc(monthLabel(mk, {month:'long'})) + '</div>'
    + '<div class="big tnum">' + money(s.expenses) + '</div>'
    + '<div class="sub" style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap">'
      + deltaChip(s.expenses, prev.expenses, false) + '<span>vs ' + esc(monthLabel(prevMk, {month:'long'})) + '</span>'
      + (avg3 > 0 ? '<span>·</span>' + deltaChip(s.expenses, avg3, false) + '<span>vs 3-month average</span>' : '')
    + '</div></section>'));

  /* the four numbers */
  const g = h('<section class="section"><div class="stats"></div></section>');
  const grid = g.querySelector('.stats');
  grid.appendChild(h('<div class="stat"><div class="k">Income</div><div class="v tnum pos">' + money(s.income) + '</div>'
    + '<div class="n">' + plural(Calc.txIn(from,to).filter(t => t.kind === 'income').length, 'entry', 'entries') + '</div></div>'));
  grid.appendChild(h('<div class="stat"><div class="k">Net saved</div><div class="v tnum">' + money(s.netSaved, {sign:true}) + '</div>'
    + '<div class="n">' + (s.outSav ? fmtMoney(s.outSav) + ' taken out' : 'into goals') + '</div></div>'));
  grid.appendChild(h('<div class="stat"><div class="k">Income − expenses</div><div class="v tnum ' + (s.net < 0 ? 'neg' : 'pos') + '">'
    + money(s.net, {sign:true}) + '</div><div class="n">before savings moves</div></div>'));
  grid.appendChild(h('<div class="stat"><div class="k">Savings rate</div><div class="v tnum">'
    + (s.savingsRate == null ? '—' : Math.round(s.savingsRate * 100) + '%')
    + '</div><div class="n">of income put aside</div></div>'));
  c.appendChild(g);

  /* budget verdict */
  const budget = Calc.monthBudget(mk);
  if (budget != null && budget > 0){
    const diff = budget - s.expenses;
    const rec = Calc.budgetRecord(Calc.allMonths().slice(-12));
    c.appendChild(h('<section class="section"><div class="section-hd"><h2>Against the budget</h2></div>'
      + '<div class="form-group" style="margin-bottom:0">'
      + statRow('Budget', money(budget))
      + statRow('Actually spent', money(s.expenses))
      + statRow(diff >= 0 ? 'Came in under by' : 'Went over by', money(Math.abs(diff)), diff >= 0 ? 'pos' : 'neg')
      + (rec.withBudget >= 2
          ? statRow('Track record', rec.under + ' of ' + rec.withBudget + ' months under', '',
              'Across the months where a budget was set, average ' +
              (rec.avgDiff >= 0 ? fmtMoney(rec.avgDiff) + ' under.' : fmtMoney(-rec.avgDiff) + ' over.'))
          : '')
      + '</div></section>'));
  }

  /* categories with change */
  const cats = Calc.byCategoryIn('expense', from, to);
  if (cats.length){
    const maxCat = cats[0].total;
    const sec = h('<section class="section"><div class="section-hd"><h2>Where it went</h2>'
      + '<span class="muted" style="font-size:13px">' + cats.length + '</span></div><div class="rows"></div></section>');
    const rows = sec.querySelector('.rows');
    cats.forEach(r => {
      const prevTotal = Calc.spentInCat(prevMk, r.id);
      const share = Math.round(r.total / s.expenses * 100);
      const row = h('<button class="row" style="align-items:flex-start">'
        + '<span class="icon" style="background:' + softOf(r.cat.color) + '">' + esc(r.cat.icon) + '</span>'
        + '<span class="body"><span style="display:flex;align-items:center;gap:8px">'
          + '<span class="t" style="flex:1">' + esc(r.cat.name) + '</span>'
          + deltaChip(r.total, prevTotal, false) + '</span>'
        + '<span class="bar thin"><i style="width:' + clamp(Math.round(r.total/maxCat*100),2,100) + '%;background:' + colorOf(r.cat.color) + '"></i></span>'
        + '<span class="s tnum">' + money(r.total) + ' · ' + share + '% of spending</span></span></button>');
      row.onclick = () => reportCategory(r.id);
      rows.appendChild(row);
    });
    c.appendChild(sec);
  }

  /* biggest single expenses */
  const top = Calc.topExpenses(from, to, 5);
  if (top.length){
    const sec = h('<section class="section"><div class="section-hd"><h2>Biggest single expenses</h2></div><div class="rows"></div></section>');
    const rows = sec.querySelector('.rows');
    top.forEach(t => rows.appendChild(txRow(t, true)));
    c.appendChild(sec);
  }

  /* daily rhythm */
  const ns = Calc.noSpendDays(mk);
  const days = Calc.dailyTotals(mk).filter(d => d.date <= todayISO());
  const busiest = days.slice().sort((a,b) => b.total - a.total)[0];
  const spentDays = days.filter(d => d.total > 0).length;
  c.appendChild(h('<section class="section"><div class="section-hd"><h2>Day by day</h2></div>'
    + '<div class="card pad">' + calendarHeat(mk)
    + '<div style="display:flex;gap:14px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--sep);font-size:13px;color:var(--text-2)">'
      + '<div style="flex:1"><div style="font-weight:700;color:var(--text)" class="tnum">' + ns.count + ' of ' + ns.of + '</div>days with no spending</div>'
      + (busiest && busiest.total ? '<div style="flex:1"><div style="font-weight:700;color:var(--text)" class="tnum">'
          + fmtMoney(busiest.total) + '</div>' + esc(shortDate(busiest.date)) + ', the heaviest day</div>' : '')
      + (spentDays ? '<div style="flex:1"><div style="font-weight:700;color:var(--text)" class="tnum">'
          + fmtMoney(Math.round(s.expenses / spentDays)) + '</div>average on a day you spent</div>' : '')
    + '</div></div></section>'));

  /* savings movement */
  if (s.inSav || s.outSav){
    const sec = h('<section class="section"><div class="section-hd"><h2>Savings moves</h2></div><div class="rows"></div></section>');
    const rows = sec.querySelector('.rows');
    state.goals.forEach(goal => {
      let added = 0, taken = 0;
      Calc.txIn(from, to).forEach(t => {
        if (t.goalId !== goal.id) return;
        if (t.kind === 'savingsDeposit') added += t.amountMinor;
        if (t.kind === 'savingsWithdrawal') taken += t.amountMinor;
      });
      if (!added && !taken) return;
      rows.appendChild(h('<div class="row">'
        + '<span class="icon" style="background:' + softOf(goal.color) + '">' + esc(goal.icon) + '</span>'
        + '<span class="body"><span class="t">' + esc(goal.name) + '</span>'
        + '<span class="s">' + (taken ? fmtMoney(added) + ' in, ' + fmtMoney(taken) + ' out' : 'balance now ' + fmtMoney(Calc.goalBalance(goal.id))) + '</span></span>'
        + '<span class="amt tnum ' + (added - taken >= 0 ? 'pos' : 'warnc') + '">' + money(added - taken, {sign:true}) + '</span></div>'));
    });
    c.appendChild(sec);
  }

  c.appendChild(exportButton('Export ' + monthLabel(mk, {month:'long', year:'numeric'}) + ' as CSV',
    from, to, 'john-money-' + mk));
}

/* ---------- YEAR ---------- */
function reportYear(c){
  const y = ui.year;
  const [from, to] = Calc.yearRange(y);
  const s = Calc.summary(from, to);
  if (s.count === 0){ emptyPeriod(c, y); return; }

  const prevY = String(Number(y) - 1);
  const [pf, pt] = Calc.yearRange(prevY);
  const prev = Calc.summary(pf, pt);
  const hasPrev = prev.count > 0;
  const months = Calc.monthsOfYear(y);
  const series = Calc.monthlySeries(months);
  const done = series.filter(d => d.mk <= thisMonth() && (d.income || d.expenses));

  c.appendChild(h('<section class="card hero">'
    + '<div class="lead">' + esc(y) + ' so far</div>'
    + '<div class="big tnum">' + money(s.expenses) + '</div>'
    + '<div class="sub" style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap">spent across '
      + plural(done.length, 'month') + (hasPrev ? ' · ' + deltaChip(s.expenses, prev.expenses, false) + '<span>vs ' + prevY + '</span>' : '')
    + '</div></section>'));

  const g = h('<section class="section"><div class="stats"></div></section>');
  const grid = g.querySelector('.stats');
  grid.appendChild(h('<div class="stat"><div class="k">Income</div><div class="v tnum pos">' + money(s.income) + '</div>'
    + '<div class="n">' + (done.length ? fmtMoney(Math.round(s.income / done.length)) + ' a month' : '') + '</div></div>'));
  grid.appendChild(h('<div class="stat"><div class="k">Expenses</div><div class="v tnum">' + money(s.expenses) + '</div>'
    + '<div class="n">' + (done.length ? fmtMoney(Math.round(s.expenses / done.length)) + ' a month' : '') + '</div></div>'));
  grid.appendChild(h('<div class="stat"><div class="k">Net saved</div><div class="v tnum">' + money(s.netSaved, {sign:true}) + '</div>'
    + '<div class="n">' + (s.outSav ? fmtMoney(s.outSav) + ' withdrawn' : 'into goals') + '</div></div>'));
  grid.appendChild(h('<div class="stat"><div class="k">Savings rate</div><div class="v tnum">'
    + (s.savingsRate == null ? '—' : Math.round(s.savingsRate * 100) + '%') + '</div><div class="n">of income put aside</div></div>'));
  c.appendChild(g);

  /* twelve months */
  c.appendChild(h('<section class="section"><div class="section-hd"><h2>Month by month</h2></div>'
    + '<div class="card pad">' + monthBars(series, {highlight: ui.month, avgLine: true, height: 130})
    + '<div style="display:flex;gap:16px;margin-top:12px;font-size:12.5px;color:var(--text-2);flex-wrap:wrap">'
    + '<span style="display:flex;align-items:center;gap:6px"><i style="width:9px;height:9px;border-radius:3px;background:var(--pos);display:inline-block"></i>Income</span>'
    + '<span style="display:flex;align-items:center;gap:6px"><i style="width:9px;height:9px;border-radius:3px;background:var(--neg);display:inline-block"></i>Expenses</span>'
    + '<span style="display:flex;align-items:center;gap:6px"><i style="width:14px;border-top:1.5px dashed var(--text-3);display:inline-block"></i>Average spend</span>'
    + '</div></div></section>'));

  /* best and worst */
  if (done.length >= 2){
    const sorted = done.slice().sort((a,b) => a.expenses - b.expenses);
    const low = sorted[0], high = sorted[sorted.length - 1];
    c.appendChild(h('<section class="section"><div class="form-group" style="margin-bottom:0">'
      + statRow('Lightest month', esc(monthLabel(low.mk, {month:'long'})) + ' · ' + money(low.expenses), 'pos')
      + statRow('Heaviest month', esc(monthLabel(high.mk, {month:'long'})) + ' · ' + money(high.expenses), 'neg')
      + statRow('Typical month', money(Math.round(s.expenses / done.length)))
      + '</div></section>'));
  }

  /* categories for the year */
  const cats = Calc.byCategoryIn('expense', from, to);
  if (cats.length){
    const maxCat = cats[0].total;
    const sec = h('<section class="section"><div class="section-hd"><h2>Categories in ' + esc(y) + '</h2></div><div class="rows"></div></section>');
    const rows = sec.querySelector('.rows');
    cats.forEach(r => {
      const prevTotal = hasPrev ? Calc.byCategoryIn('expense', pf, pt).find(x => x.id === r.id) : null;
      const share = Math.round(r.total / s.expenses * 100);
      const row = h('<button class="row" style="align-items:flex-start">'
        + '<span class="icon" style="background:' + softOf(r.cat.color) + '">' + esc(r.cat.icon) + '</span>'
        + '<span class="body"><span style="display:flex;align-items:center;gap:8px">'
        + '<span class="t" style="flex:1">' + esc(r.cat.name) + '</span>'
        + (hasPrev ? deltaChip(r.total, prevTotal ? prevTotal.total : 0, false) : '') + '</span>'
        + '<span class="bar thin"><i style="width:' + clamp(Math.round(r.total/maxCat*100),2,100) + '%;background:' + colorOf(r.cat.color) + '"></i></span>'
        + '<span class="s tnum">' + money(r.total) + ' · ' + share + '% · '
        + (state.settings.hideAmounts ? '•••' : fmtMoney(Math.round(r.total / Math.max(1, done.length))) + '/month') + '</span></span></button>');
      row.onclick = () => reportCategory(r.id);
      rows.appendChild(row);
    });
    c.appendChild(sec);
  }

  /* year on year movers */
  if (hasPrev){
    const curCats = Calc.byCategoryIn('expense', from, to);
    const prevCats = Calc.byCategoryIn('expense', pf, pt);
    const ids = new Set([...curCats.map(r => r.id), ...prevCats.map(r => r.id)]);
    const movers = [...ids].map(id => {
      const a = (curCats.find(r => r.id === id) || {total:0}).total;
      const b = (prevCats.find(r => r.id === id) || {total:0}).total;
      return {id, cat: catById(id), diff: a - b, a, b};
    }).filter(r => r.cat && r.diff !== 0).sort((x, z) => Math.abs(z.diff) - Math.abs(x.diff)).slice(0, 5);
    if (movers.length){
      const sec = h('<section class="section"><div class="section-hd"><h2>Biggest changes vs ' + esc(prevY) + '</h2></div><div class="rows"></div></section>');
      const rows = sec.querySelector('.rows');
      movers.forEach(m => rows.appendChild(h('<div class="row">'
        + '<span class="icon" style="background:' + softOf(m.cat.color) + '">' + esc(m.cat.icon) + '</span>'
        + '<span class="body"><span class="t">' + esc(m.cat.name) + '</span>'
        + '<span class="s tnum">' + fmtMoney(m.b) + ' → ' + fmtMoney(m.a) + '</span></span>'
        + '<span class="amt tnum ' + (m.diff > 0 ? 'neg' : 'pos') + '">' + money(m.diff, {sign:true}) + '</span></div>')));
      c.appendChild(sec);
    }
  }

  c.appendChild(exportButton('Export ' + y + ' as CSV', from, to, 'john-money-' + y));
}

/* ---------- ALL TIME ---------- */
function reportAllTime(c){
  const first = Calc.firstEntryDate();
  if (!first){ emptyPeriod(c, 'any period'); return; }
  const [from, to] = Calc.allRange();
  const s = Calc.summary(from, to);
  const months = Calc.allMonths();
  const years = Calc.yearsWithData().filter(y => Calc.summary(...Calc.yearRange(y)).count > 0);

  c.appendChild(h('<section class="card hero">'
    + '<div class="lead">Since ' + esc(dayLabel(first) === 'Today' ? 'today' : shortDate(first) + ' ' + first.slice(0,4)) + '</div>'
    + '<div class="big tnum ' + (s.net < 0 ? 'neg' : '') + '">' + money(s.net, {sign:true}) + '</div>'
    + '<div class="sub">income minus expenses, across ' + plural(months.length, 'month') + '</div></section>'));

  const g = h('<section class="section"><div class="stats"></div></section>');
  const grid = g.querySelector('.stats');
  grid.appendChild(h('<div class="stat"><div class="k">Total income</div><div class="v tnum pos">' + money(s.income) + '</div>'
    + '<div class="n">' + fmtMoney(Math.round(s.income / months.length)) + ' a month</div></div>'));
  grid.appendChild(h('<div class="stat"><div class="k">Total expenses</div><div class="v tnum">' + money(s.expenses) + '</div>'
    + '<div class="n">' + fmtMoney(Math.round(s.expenses / months.length)) + ' a month</div></div>'));
  grid.appendChild(h('<div class="stat"><div class="k">In savings now</div><div class="v tnum">' + money(Calc.totalSaved()) + '</div>'
    + '<div class="n">' + plural(activeGoals().length, 'active goal') + '</div></div>'));
  grid.appendChild(h('<div class="stat"><div class="k">Entries recorded</div><div class="v tnum">' + s.count + '</div>'
    + '<div class="n">' + (months.length ? Math.round(s.count / months.length) + ' a month' : '') + '</div></div>'));
  c.appendChild(g);

  /* cumulative */
  const cum = Calc.cumulativeNet();
  c.appendChild(h('<section class="section"><div class="section-hd"><h2>Running total</h2></div>'
    + '<div class="card pad">' + lineChart(cum, {height:100})
    + '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-3);margin-top:6px">'
    + '<span>' + esc(monthShort(cum[0].mk) + ' ' + cum[0].mk.slice(0,4)) + '</span>'
    + '<span>' + esc(monthShort(cum[cum.length-1].mk) + ' ' + cum[cum.length-1].mk.slice(0,4)) + '</span></div>'
    + '<div style="margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep);font-size:13px;color:var(--text-2)">'
    + 'Everything that has come in, minus everything that has gone out, since you started. Not a bank balance — money already in savings goals is still counted as yours.'
    + '</div></div></section>'));

  /* year by year */
  if (years.length){
    const sec = h('<section class="section"><div class="section-hd"><h2>Year by year</h2></div><div class="rows"></div></section>');
    const rows = sec.querySelector('.rows');
    years.slice().reverse().forEach(y => {
      const ys = Calc.summary(...Calc.yearRange(y));
      const row = h('<button class="row" style="align-items:flex-start">'
        + '<span class="body"><span class="t">' + esc(y) + '</span>'
        + '<span class="s tnum">' + fmtMoney(ys.income) + ' in · ' + fmtMoney(ys.expenses) + ' out · '
        + fmtMoney(ys.netSaved) + ' saved</span></span>'
        + '<span class="amt tnum ' + (ys.net < 0 ? 'neg' : 'pos') + '">' + money(ys.net, {sign:true}) + '</span>'
        + '<span class="chev">' + ico('chevR',17) + '</span></button>');
      row.onclick = () => { ui.year = y; ui.reportPeriod = 'year'; render(); };
      rows.appendChild(row);
    });
    c.appendChild(sec);
  }

  /* lifetime categories */
  const cats = Calc.byCategoryIn('expense', from, to).slice(0, 8);
  if (cats.length){
    const maxCat = cats[0].total;
    const sec = h('<section class="section"><div class="section-hd"><h2>Where it has all gone</h2></div><div class="rows"></div></section>');
    const rows = sec.querySelector('.rows');
    cats.forEach(r => {
      const row = h('<button class="row" style="align-items:flex-start">'
        + '<span class="icon" style="background:' + softOf(r.cat.color) + '">' + esc(r.cat.icon) + '</span>'
        + '<span class="body"><span class="t">' + esc(r.cat.name) + '</span>'
        + '<span class="bar thin"><i style="width:' + clamp(Math.round(r.total/maxCat*100),2,100) + '%;background:' + colorOf(r.cat.color) + '"></i></span>'
        + '<span class="s tnum">' + money(r.total) + ' · ' + Math.round(r.total / s.expenses * 100) + '% of everything</span></span></button>');
      row.onclick = () => reportCategory(r.id);
      rows.appendChild(row);
    });
    c.appendChild(sec);
  }

  c.appendChild(exportButton('Export everything as CSV', from, to, 'john-money-all'));
}

function exportButton(label, from, to, name){
  const b = h('<button class="btn secondary" style="margin-top:22px">' + esc(label) + '</button>');
  b.onclick = () => exportCSV({from, to, name});
  return b;
}

/* ============================================================
   DEEP DIVES
   ============================================================ */
function reportCategoryPicker(){
  const items = state.categories
    .filter(c => !c.isArchived || txHasCat(c.id))
    .map(c => ({id:c.id, name:c.name, icon:c.icon, color:c.color, sub: c.type === 'income' ? 'Income' : undefined}));
  pickerSheet('Which category?', items, null, (id) => { if (id) setTimeout(() => reportCategory(id), 250); });
}

function reportCategory(catId){
  const cat = catById(catId);
  if (!cat) return;
  const months = [];
  for (let i = 11; i >= 0; i--) months.push(monthShift(thisMonth(), -i));
  const series = Calc.categorySeries(catId, months);
  const totals = series.map(x => x.total);
  const max = Math.max(1, ...totals);
  const active = totals.filter(t => t > 0);
  const avg = active.length ? Math.round(active.reduce((a,b) => a+b, 0) / active.length) : 0;
  const recent3 = Math.round(totals.slice(-3).reduce((a,b) => a+b, 0) / 3);
  const older3 = Math.round(totals.slice(-6, -3).reduce((a,b) => a+b, 0) / 3);
  const rec = Calc.limitRecord(catId, months);
  const isIncome = cat.type === 'income';

  sheet({
    title: cat.name, left:'Done',
    build(s){
      const [af, at] = [periodStart(months[0]), periodEnd(months[11])];
      const top = state.transactions
        .filter(t => t.categoryId === catId && t.date >= af && t.date < at)
        .sort((a,b) => b.amountMinor - a.amountMinor).slice(0, 5);

      s.body.innerHTML =
        '<div class="card hero" style="text-align:center">'
        + '<div class="icon lg" style="background:' + softOf(cat.color) + ';margin:0 auto 10px;width:52px;height:52px;font-size:26px;border-radius:15px">' + esc(cat.icon) + '</div>'
        + '<div class="big tnum">' + money(totals.reduce((a,b)=>a+b,0)) + '</div>'
        + '<div class="sub">over the last 12 months</div></div>'
        + '<div class="section-hd" style="margin-top:20px"><h2>Month by month</h2></div>'
        + '<div class="card pad"><div class="trend" style="height:110px">'
        + series.map(x => {
            const cur = x.mk === thisMonth();
            const overLimit = x.limit != null && x.total > x.limit;
            return '<div class="col' + (cur ? ' cur' : '') + '">'
              + '<div class="stack"><div class="b" style="height:' + clamp(x.total/max*100, x.total ? 4 : 0, 100)
              + '%;background:' + (overLimit ? 'var(--neg)' : colorOf(cat.color)) + ';opacity:' + (cur ? 1 : .6) + '"></div></div>'
              + '<div class="lb">' + esc(monthShort(x.mk).slice(0,1)) + '</div></div>';
          }).join('')
        + '</div>'
        + (rec.exceeded ? '<div style="font-size:12px;color:var(--text-2);margin-top:8px">Red bars are months that went past the limit.</div>' : '')
        + '</div>'
        + '<div class="form-group" style="margin-top:18px">'
        + statRow('Average, active months', money(avg))
        + statRow('Last 3 months', money(recent3))
        + (older3 > 0 ? statRow('The 3 before that', money(older3), '',
            recent3 === older3 ? 'Steady.' :
            recent3 > older3 ? 'Running ' + fmtMoney(recent3 - older3) + ' a month higher lately.'
                             : 'Running ' + fmtMoney(older3 - recent3) + ' a month lower lately.') : '')
        + statRow('Months with any activity', active.length + ' of 12')
        + (rec.withLimit ? statRow('Limit held', (rec.withLimit - rec.exceeded) + ' of ' + rec.withLimit + ' months',
            rec.exceeded > rec.withLimit / 2 ? 'warnc' : 'pos',
            rec.exceeded ? 'Over by ' + fmtMoney(rec.avgOver) + ' on average when it went past.' : '') : '')
        + '</div>'
        + (top.length ? '<div class="section-hd"><h2>Largest entries</h2></div><div class="rows" id="tl"></div>' : '');

      if (top.length){
        const tl = s.body.querySelector('#tl');
        top.forEach(t => tl.appendChild(txRow(t, true)));
      }
      if (isIncome) s.body.querySelectorAll('[data-limit]').forEach(x => x.remove());
    },
    onClose(){ render(); }
  });
}

function reportCommitments(){
  const list = Calc.commitments();
  const months = [];
  for (let i = 5; i >= 0; i--) months.push(monthShift(thisMonth(), -i));
  const alwaysOn = Calc.alwaysOnCategories(months);
  const monthlyTotal = list.filter(x => x.rule.kind === 'expense' || x.rule.kind === 'savingsDeposit')
    .reduce((a, b) => a + b.monthly, 0);
  const baseline = alwaysOn.reduce((a, b) => a + b.avg, 0);

  sheet({
    title:'Fixed commitments', left:'Done',
    build(s){
      s.body.innerHTML =
        '<div class="card hero" style="text-align:center">'
        + '<div class="lead">Repeating every month</div>'
        + '<div class="big tnum">' + money(monthlyTotal) + '</div>'
        + '<div class="sub">' + money(monthlyTotal * 12) + ' over a year</div></div>'
        + (list.length
            ? '<div class="section-hd" style="margin-top:20px"><h2>Your repeating entries</h2></div><div class="rows" id="cl"></div>'
            : '<div class="card" style="margin-top:16px" id="none"></div>')
        + (alwaysOn.length
            ? '<div class="section-hd" style="margin-top:22px"><h2>Always-on categories</h2></div>'
              + '<div class="group-note" style="margin:0 4px 8px">Categories with spending in all of the last 6 months. Together they average <b>'
              + esc(fmtMoney(baseline)) + '</b> a month — roughly the floor under your spending.</div>'
              + '<div class="rows" id="al"></div>'
            : '');

      if (list.length){
        const cl = s.body.querySelector('#cl');
        list.forEach(x => {
          const cat = x.rule.categoryId ? catById(x.rule.categoryId) : null;
          const goal = x.rule.goalId ? goalById(x.rule.goalId) : null;
          cl.appendChild(h('<div class="row" style="align-items:flex-start">'
            + '<span class="icon" style="background:' + softOf(cat ? cat.color : goal ? goal.color : KIND_META[x.rule.kind].color) + '">'
            + esc(cat ? cat.icon : goal ? goal.icon : KIND_META[x.rule.kind].icon) + '</span>'
            + '<span class="body"><span class="t">' + esc(x.label) + '</span>'
            + '<span class="s tnum">' + esc(fmtMoney(x.yearly)) + ' a year · next ' + esc(shortDate(x.rule.nextDate)) + '</span></span>'
            + '<span class="amt tnum">' + money(x.monthly) + '</span></div>'));
        });
      } else {
        s.body.querySelector('#none').appendChild(emptyState('🔁','Nothing set to repeat yet',
          'Switch on "Repeat every month" when adding rent, a salary or a subscription, and it will show up here with its yearly cost.'));
      }
      if (alwaysOn.length){
        const al = s.body.querySelector('#al');
        alwaysOn.forEach(r => al.appendChild(h('<div class="row">'
          + '<span class="icon" style="background:' + softOf(r.cat.color) + '">' + esc(r.cat.icon) + '</span>'
          + '<span class="body"><span class="t">' + esc(r.cat.name) + '</span>'
          + '<span class="s">every month for 6 months</span></span>'
          + '<span class="amt tnum">' + money(r.avg) + '</span></div>')));
      }
    }
  });
}

function reportSavingsForecast(){
  const goals = activeGoals();
  sheet({
    title:'Savings forecast', left:'Done',
    build(s){
      if (!goals.length){
        s.body.innerHTML = '<div class="card"></div>';
        s.body.querySelector('.card').appendChild(emptyState('🎯','No active goals','Create a savings goal and this will show when it lands.'));
        return;
      }
      s.body.innerHTML =
        '<div class="group-note" style="margin-top:0">Based on what you have actually been putting away over the last six months, not on the target date.</div>'
        + '<div id="gl"></div>';
      const gl = s.body.querySelector('#gl');
      goals.forEach(g => {
        const p = Calc.goalProjection(g.id);
        const bal = Calc.goalBalance(g.id);
        const pct = g.targetMinor > 0 ? clamp(Math.round(bal/g.targetMinor*100),0,999) : 0;
        let verdict, cls = '';
        if (p.done){ verdict = 'Target reached.'; cls = 'pos'; }
        else if (!p.rate){ verdict = 'Nothing added in the last 6 months, so there is no pace to project from.'; cls = 'muted'; }
        else {
          verdict = 'At ' + fmtMoney(p.rate) + ' a month, on track for <b>' + esc(monthLabel(p.etaMonth, {month:'long', year:'numeric'})) + '</b>'
            + ' — ' + plural(p.monthsLeft, 'month') + ' away.';
          if (p.vsTarget != null){
            verdict += p.vsTarget > 0 ? ' That is ' + plural(p.vsTarget, 'month') + ' after your target date.'
                     : p.vsTarget < 0 ? ' That is ' + plural(-p.vsTarget, 'month') + ' ahead of your target date.'
                     : ' Exactly on your target date.';
            cls = p.vsTarget > 0 ? 'warnc' : 'pos';
          }
        }
        gl.appendChild(h('<div class="card pad" style="margin-bottom:12px">'
          + '<div style="display:flex;gap:12px;align-items:center;margin-bottom:10px">'
            + '<span class="icon lg" style="background:' + softOf(g.color) + '">' + esc(g.icon) + '</span>'
            + '<span style="flex:1"><span style="display:block;font-weight:650">' + esc(g.name) + '</span>'
            + '<span class="s tnum" style="font-size:13px;color:var(--text-2)">' + money(bal) + ' of ' + money(g.targetMinor) + '</span></span>'
            + '<span class="tnum" style="font-weight:750;color:' + colorOf(g.color) + '">' + pct + '%</span></div>'
          + '<div class="bar thin"><i style="width:' + clamp(pct,0,100) + '%;background:' + colorOf(g.color) + '"></i></div>'
          + '<div class="' + cls + '" style="font-size:13.5px;line-height:1.45;margin-top:8px">' + verdict + '</div></div>'));
      });
    }
  });
}

function reportLimits(){
  const months = [];
  for (let i = 5; i >= 0; i--) months.push(monthShift(thisMonth(), -i));
  const rows = catsOf('expense', true)
    .map(cat => ({cat, rec: Calc.limitRecord(cat.id, months)}))
    .filter(r => r.rec.withLimit > 0)
    .sort((a, b) => (b.rec.exceeded / b.rec.withLimit) - (a.rec.exceeded / a.rec.withLimit));

  sheet({
    title:'Are your limits realistic?', left:'Done',
    build(s){
      if (!rows.length){
        s.body.innerHTML = '<div class="card"></div>';
        s.body.querySelector('.card').appendChild(emptyState('📐','No limits set yet',
          'Set a monthly limit on a category in the Budget tab, and after a month or two this will tell you whether it was a sensible number.'));
        return;
      }
      s.body.innerHTML =
        '<div class="group-note" style="margin-top:0">A limit you go past every month is telling you something about the limit, not only about the spending. This compares the last six months against what you set.</div>'
        + '<div id="ll"></div>';
      const ll = s.body.querySelector('#ll');
      rows.forEach(({cat, rec}) => {
        const held = rec.withLimit - rec.exceeded;
        const ratio = rec.exceeded / rec.withLimit;
        const verdict = ratio === 0
          ? '<span class="pos">Held every month.</span>'
          : ratio <= 0.34
            ? 'Held in most months. Over by ' + fmtMoney(rec.avgOver) + ' on average when it slipped.'
            : '<span class="warnc">Over in ' + rec.exceeded + ' of ' + rec.withLimit + ' months</span>, by '
              + fmtMoney(rec.avgOver) + ' on average. A limit of <b>' + esc(fmtMoney(rec.suggestion))
              + '</b> would match what you actually spend.';
        const row = h('<div class="card pad" style="margin-bottom:12px">'
          + '<div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">'
            + '<span class="icon" style="background:' + softOf(cat.color) + '">' + esc(cat.icon) + '</span>'
            + '<span style="flex:1;font-weight:650">' + esc(cat.name) + '</span>'
            + '<span class="pill ' + (ratio === 0 ? 'ok' : ratio <= 0.34 ? 'warn' : 'over') + '">' + held + '/' + rec.withLimit + ' held</span></div>'
          + '<div style="font-size:13.5px;line-height:1.45;color:var(--text-2)">' + verdict + '</div>'
          + (ratio > 0.34 && rec.suggestion
              ? '<button class="btn secondary" style="margin-top:10px;padding:9px;font-size:14px">Set ' + esc(fmtMoney(rec.suggestion)) + ' for ' + esc(monthLabel(thisMonth(), {month:'long'})) + '</button>'
              : '')
          + '</div>');
        const btn = row.querySelector('button');
        if (btn) btn.onclick = () => {
          const mk = thisMonth();
          if (!state.categoryBudgets[mk]) state.categoryBudgets[mk] = {};
          state.categoryBudgets[mk][cat.id] = rec.suggestion;
          save(true); toast('Limit updated'); btn.remove(); render();
        };
        ll.appendChild(row);
      });
    },
    onClose(){ render(); }
  });
}

function reportWeekday(){
  const months = [];
  for (let i = 5; i >= 0; i--) months.push(monthShift(thisMonth(), -i));
  const from = months[0] + '-01', to = monthShift(months[5], 1) + '-01';
  const data = Calc.weekdayTotals(from, to);
  const names = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const max = Math.max(1, ...data.map(d => d.total));
  const total = data.reduce((a, b) => a + b.total, 0);
  const weekend = data[5].total + data[6].total;

  sheet({
    title:'Spending by weekday', left:'Done',
    build(s){
      s.body.innerHTML =
        '<div class="group-note" style="margin-top:0">Expenses over the last six months, grouped by the day of the week they fall on.</div>'
        + '<div class="card pad">'
        + data.map(d => '<div style="margin-bottom:11px">'
            + '<div style="display:flex;font-size:13.5px;margin-bottom:4px"><span style="flex:1;font-weight:550">' + names[d.i] + '</span>'
            + '<span class="tnum muted">' + money(d.total) + '</span></div>'
            + '<div class="bar thin" style="margin:0"><i style="width:' + clamp(Math.round(d.total/max*100), d.total ? 2 : 0, 100)
            + '%;background:' + (d.i >= 5 ? 'var(--warn)' : 'var(--accent)') + '"></i></div></div>').join('')
        + '</div>'
        + (total > 0 ? '<div class="form-group" style="margin-top:18px">'
            + statRow('Heaviest day', names[data.slice().sort((a,b) => b.total - a.total)[0].i])
            + statRow('Weekends', Math.round(weekend / total * 100) + '% of spending', '',
                'Saturday and Sunday are 2 of 7 days, so anything much above 29% means the weekend carries more than its share.')
            + '</div>' : '');
    }
  });
}

/* ============================================================
   NOTES — folders, and many notes inside each.
   Notes live in the same state object as everything else, so they are
   covered by backups, restores and the automatic snapshot for free.
   ============================================================ */

const NOTE_ICONS = ('📁 📒 📝 💡 ✅ 🧾 🏠 🚗 ✈️ 🎁 🛒 🍽️ 💊 🏋️ 🎓 💼 🔧 🐾 👶 🌿 ⭐ 🔒 📌 🎯 🧳 🎨 🎸 📞').split(' ');

const notesInFolder = (fid) => state.notes
  .filter(n => n.folderId === fid)
  .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updatedAt - a.updatedAt);
const folderById = (id) => state.noteFolders.find(f => f.id === id) || null;
const unfiledNotes = () => state.notes.filter(n => !n.folderId || !folderById(n.folderId));

function noteExcerpt(n){
  const body = (n.body || '').replace(/\s+/g, ' ').trim();
  return body ? body.slice(0, 90) : 'No text yet';
}
function noteWhen(n){
  const iso = dateToISO(new Date(n.updatedAt));
  return dayLabel(iso);
}

/* ---------- the tab ---------- */
function viewNotes(){
  if (ui.noteFolder) return viewNoteFolder(ui.noteFolder);

  const wrap = h('<div style="flex:1;display:flex;flex-direction:column"></div>');
  const addBtn = h('<button class="pill neutral" style="gap:4px">' + ico('plus',14,2.4) + 'Folder</button>');
  addBtn.onclick = () => editFolder(null);
  wrap.appendChild(header('Notes', {right: addBtn}));
  const c = h('<main class="content fade-in"></main>');

  /* search across every note */
  const sb = h('<div class="searchbar">' + ico('search',18)
    + '<input type="search" placeholder="Search all notes" value="' + esc(ui.noteQuery) + '" aria-label="Search notes"></div>');
  const input = sb.querySelector('input');
  input.oninput = () => { ui.noteQuery = input.value; const l = $('#notesbody'); if (l) l.replaceWith(buildNotesBody()); };
  c.appendChild(sb);
  c.appendChild(buildNotesBody());

  wrap.appendChild(c);
  return wrap;
}

function buildNotesBody(){
  const el = h('<div id="notesbody"></div>');
  const q = ui.noteQuery.trim().toLowerCase();

  if (q){
    const hits = state.notes.filter(n =>
      (n.title + ' ' + (n.body || '')).toLowerCase().includes(q)
    ).sort((a, b) => b.updatedAt - a.updatedAt);
    if (!hits.length){
      const card = h('<div class="card"></div>');
      card.appendChild(emptyState('🔍', 'No notes match', 'Try a different word.'));
      el.appendChild(card);
      return el;
    }
    el.appendChild(h('<div class="day-hd"><span>' + plural(hits.length, 'result') + '</span></div>'));
    const rows = h('<div class="rows"></div>');
    hits.forEach(n => rows.appendChild(noteRow(n, true)));
    el.appendChild(rows);
    return el;
  }

  if (!state.noteFolders.length && !state.notes.length){
    const card = h('<div class="card"></div>');
    card.appendChild(emptyState('📒', 'No notes yet',
      'Make a folder for a theme — Bills, Car, Holiday, Ideas — and keep as many notes inside it as you like.',
      'Create a folder', () => editFolder(null)));
    el.appendChild(card);
    return el;
  }

  /* folders */
  if (state.noteFolders.length){
    const sec = h('<section class="section" style="margin-top:6px"><div class="section-hd"><h2>Folders</h2>'
      + '<span class="muted" style="font-size:13px">' + state.noteFolders.length + '</span></div><div class="rows"></div></section>');
    const rows = sec.querySelector('.rows');
    state.noteFolders.slice().sort((a,b) => a.createdAt - b.createdAt).forEach(f => {
      const n = notesInFolder(f.id).length;
      const r = h('<button class="row" style="padding:13px 14px">'
        + '<span class="icon lg" style="background:' + softOf(f.color) + '">' + esc(f.icon) + '</span>'
        + '<span class="body"><span class="t">' + esc(f.name) + '</span>'
        + '<span class="s">' + (n ? plural(n, 'note') : 'Empty') + '</span></span>'
        + '<span class="chev">' + ico('chevR',17) + '</span></button>');
      r.onclick = () => { ui.noteFolder = f.id; haptic(); render(); window.scrollTo(0,0); };
      rows.appendChild(r);
    });
    el.appendChild(sec);
  }

  /* notes that belong to no folder */
  const loose = unfiledNotes();
  if (loose.length){
    const sec = h('<section class="section"><div class="section-hd"><h2>Unfiled</h2></div><div class="rows"></div></section>');
    const rows = sec.querySelector('.rows');
    loose.sort((a,b) => b.updatedAt - a.updatedAt).forEach(n => rows.appendChild(noteRow(n)));
    el.appendChild(sec);
  }

  /* a quick way back into what you touched last */
  const recent = state.notes.slice().sort((a,b) => b.updatedAt - a.updatedAt).slice(0, 4);
  if (recent.length > 1){
    const sec = h('<section class="section"><div class="section-hd"><h2>Recently edited</h2></div><div class="rows"></div></section>');
    const rows = sec.querySelector('.rows');
    recent.forEach(n => rows.appendChild(noteRow(n, true)));
    el.appendChild(sec);
  }
  return el;
}

function noteRow(n, showFolder){
  const f = n.folderId ? folderById(n.folderId) : null;
  const sub = [showFolder && f ? f.name : null, noteWhen(n)].filter(Boolean).join(' · ');
  const r = h('<button class="row" style="align-items:flex-start">'
    + (n.pinned ? '<span class="icon sm" style="background:var(--warn-soft);margin-top:3px">📌</span>' : '')
    + '<span class="body"><span class="t">' + esc(n.title || 'Untitled') + '</span>'
    + '<span class="s">' + esc(noteExcerpt(n)) + '</span>'
    + '<span class="s" style="color:var(--text-3);font-size:12px">' + esc(sub) + '</span></span>'
    + '<span class="chev">' + ico('chevR',17) + '</span></button>');
  if (!n.pinned) r.classList.add('norule');
  r.onclick = () => editNote(n.id);
  return r;
}

/* ---------- one folder ---------- */
function viewNoteFolder(fid){
  const f = folderById(fid);
  if (!f){ ui.noteFolder = null; return viewNotes(); }
  const wrap = h('<div style="flex:1;display:flex;flex-direction:column"></div>');

  const back = h('<button class="pill neutral" style="gap:3px;padding:6px 11px 6px 7px">' + ico('chevL',15,2.4) + 'Notes</button>');
  back.onclick = () => { ui.noteFolder = null; haptic(); render(); };
  const edit = h('<button class="pill neutral" style="gap:4px">' + ico('edit',13,2) + 'Edit</button>');
  edit.onclick = () => editFolder(fid);

  const hdr = h('<header class="hdr"></header>');
  const top = h('<div class="hdr-row" style="min-height:30px"></div>');
  top.append(back, h('<span style="flex:1"></span>'), edit);
  const title = h('<div class="hdr-row" style="margin-top:4px"></div>');
  title.appendChild(h('<h1>' + esc(f.icon + ' ' + f.name) + '</h1>'));
  hdr.append(top, title);
  wrap.appendChild(hdr);

  const c = h('<main class="content fade-in"></main>');
  const notes = notesInFolder(fid);
  if (!notes.length){
    const card = h('<div class="card"></div>');

      'New note', () => editNote(null, fid)));
    c.appendChild(card);
  } else {
    const rows = h('<div class="rows"></div>');
    notes.forEach(n => rows.appendChild(noteRow(n)));
    c.appendChild(rows);
    c.appendChild(h('<div class="group-note" style="margin-top:14px">' + plural(notes.length, 'note') + ' in this folder.</div>'));

/* ---------- folder editor ---------- */
function editFolder(fid){
  const existing = fid ? folderById(fid) : null;
  const draft = existing ? Object.assign({}, existing)
    : {id:uid(), name:'', icon:'📁', color:'blue', createdAt:Date.now()};
  const count = existing ? notesInFolder(existing.id).length : 0;

  sheet({
    title: existing ? 'Edit folder' : 'New folder', left:'Cancel', right:'Save',
    build(s){
      s.body.innerHTML =
        '<div class="form-group"><label class="fr"><span class="lab">Name</span>'
        + '<input id="fn" type="text" placeholder="Bills, Car, Ideas…" maxlength="30" value="' + esc(draft.name) + '"></label></div>'
        + '<div class="form-group"><div class="fr col"><span class="lab">COLOR</span><div class="swatches" id="sw"></div></div>'
        + '<div class="fr col"><span class="lab">ICON</span><div class="emoji-grid" id="eg"></div></div></div>'
        + (existing ? '<button class="btn danger" id="del">Delete folder</button>'
            + (count ? '<div class="group-note" style="margin-top:10px">Its ' + plural(count, 'note')
              + ' would not be deleted — they move to Unfiled.</div>' : '') : '');
      const fn = s.body.querySelector('#fn');
      const validate = () => s.setRight('Save', fn.value.trim().length > 0);
      fn.oninput = validate;
      const sw = s.body.querySelector('#sw');
      PALETTE.forEach(pl => {
        const b = h('<button class="sw" aria-selected="' + (pl.id===draft.color) + '" aria-label="' + pl.id + '"><i style="background:' + (isDark()?pl.dark:pl.light) + '"></i></button>');
        b.onclick = () => { draft.color = pl.id; sw.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-selected','false')); b.setAttribute('aria-selected','true'); };
        sw.appendChild(b);
      });
      const eg = s.body.querySelector('#eg');
      NOTE_ICONS.forEach(e => {
        const b = h('<button aria-selected="' + (e===draft.icon) + '">' + e + '</button>');
        b.onclick = () => { draft.icon = e; eg.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected','false')); b.setAttribute('aria-selected','true'); };
        eg.appendChild(b);
      });
      const del = s.body.querySelector('#del');
      if (del) del.onclick = async () => {
        const ok = await confirmBox('Delete this folder?',
          count ? 'Its ' + plural(count, 'note') + ' will move to Unfiled, not be deleted.' : 'The folder is empty.',
          'Delete', true);
        if (!ok) return;
        state.notes.forEach(n => { if (n.folderId === existing.id) n.folderId = null; });
        state.noteFolders = state.noteFolders.filter(x => x.id !== existing.id);
        if (ui.noteFolder === existing.id) ui.noteFolder = null;
        save(true); s.close(); render(); toast('Folder deleted');
      };
      validate();
      setTimeout(() => fn.focus(), 380);
    },
    onRight(close){
      const nm = $('#fn').value.trim();
      if (!nm){ toast('Give the folder a name'); return; }
      draft.name = nm;
      if (existing) Object.assign(existing, draft); else state.noteFolders.push(draft);
      save(true); close(); render(); toast(existing ? 'Saved' : 'Folder created');
    }
  });
}

/* ---------- note editor ---------- */
function editNote(noteId, presetFolder){
  const existing = noteId ? state.notes.find(n => n.id === noteId) : null;
  const draft = existing ? Object.assign({}, existing)
    : {id:uid(), folderId: presetFolder || ui.noteFolder || null, title:'', body:'',
       pinned:false, createdAt:Date.now(), updatedAt:Date.now()};
  let dirty = false;

  const s = sheet({
    title: existing ? 'Note' : 'New note', left:'Cancel', right:'Save',
    dismissible: false,
    onLeft(close){
      if (!dirty) return close();
      confirmBox('Discard changes?', 'This note will not be saved.', 'Discard', true).then(ok => { if (ok) close(); });
    },
    build(sh){
      const f = draft.folderId ? folderById(draft.folderId) : null;
      sh.body.innerHTML =
        '<input id="nt" type="text" placeholder="Title" maxlength="80" value="' + esc(draft.title) + '" '
        + 'style="width:100%;font-family:var(--font-round);font-size:24px;font-weight:750;letter-spacing:-.5px;padding:4px 2px 10px">'
        + '<textarea id="nb" placeholder="Write anything here…" '
        + 'style="width:100%;min-height:38vh;font-size:16px;line-height:1.5;padding:2px;resize:vertical">' + esc(draft.body) + '</textarea>'
        + '<div class="form-group" style="margin-top:16px">'
          + '<button class="fr" id="pickf"><span class="lab">Folder</span><span class="val">'
            + (f ? esc(f.icon + '  ' + f.name) : 'Unfiled') + '</span><span class="chev">' + ico('chevR',17) + '</span></button>'
          + '<button class="fr" id="pin"><span class="lab" style="flex:1;min-width:0">Pin to the top</span>'
            + '<span class="switch" role="switch" aria-checked="' + !!draft.pinned + '"><i></i></span></button>'
        + '</div>'
        + (existing ? '<div class="group-note">Created ' + esc(dayLabel(dateToISO(new Date(existing.createdAt))))
            + ' · last edited ' + esc(noteWhen(existing)) + '</div>'
            + '<button class="btn danger" id="del">Delete note</button>' : '');

      const nt = sh.body.querySelector('#nt'), nb = sh.body.querySelector('#nb');
      const touch = () => { dirty = true; sh.setRight('Save', !!(nt.value.trim() || nb.value.trim())); };
      nt.oninput = touch; nb.oninput = touch;
      sh.setRight('Save', !!(draft.title.trim() || draft.body.trim()));

      sh.body.querySelector('#pickf').onclick = () => {
        const items = state.noteFolders.map(x => ({id:x.id, name:x.name, icon:x.icon, color:x.color}));
        items.unshift({id:'__none', name:'Unfiled', icon:'—', color:'slate'});
        pickerSheet('Move to folder', items, draft.folderId || '__none', (id, act) => {
          if (act === 'new'){ editFolder(null); return; }
          if (!id) return;
          draft.folderId = id === '__none' ? null : id;
          draft.title = nt.value; draft.body = nb.value;
          dirty = true;
          sh.close(); setTimeout(() => editNoteResume(draft, existing, dirty), 260);
        }, '<button class="btn secondary" data-act="new" style="margin-bottom:14px">+ New folder</button>');
      };
      sh.body.querySelector('#pin').onclick = () => {
        draft.pinned = !draft.pinned; dirty = true;
        sh.body.querySelector('#pin .switch').setAttribute('aria-checked', draft.pinned);
        haptic();
      };
      const del = sh.body.querySelector('#del');
      if (del) del.onclick = async () => {
        if (await confirmBox('Delete this note?', 'It cannot be brought back.', 'Delete', true)){
          state.notes = state.notes.filter(n => n.id !== existing.id);
          save(true); sh.close(); render(); toast('Note deleted');
        }
      };
      setTimeout(() => { if (!existing) nt.focus(); }, 380);
    },
    onRight(close){
      const nt = $('#nt'), nb = $('#nb');
      draft.title = (nt ? nt.value : draft.title).trim();
      draft.body = (nb ? nb.value : draft.body);
      if (!draft.title && !draft.body.trim()){ toast('Write something first'); return; }
      if (!draft.title) draft.title = draft.body.trim().split('\n')[0].slice(0, 60);
      draft.updatedAt = Date.now();
      if (existing) Object.assign(existing, draft); else state.notes.push(draft);
      save(true); close(); render(); toast(existing ? 'Saved' : 'Note created');
    }
  });
  return s;
}
/** Reopen the editor after the folder picker replaced it, keeping the draft. */
function editNoteResume(draft, existing, dirty){
  if (existing){ Object.assign(existing, draft, {updatedAt: Date.now()}); save(true); render(); editNote(existing.id); }
  else { state.notes.push(Object.assign({}, draft, {updatedAt: Date.now()})); save(true); render(); editNote(draft.id); }
}

function viewSavings(){

  const archived = state.goals.filter(g => g.isArchived);

  const mk = ui.month;

    + '<div class="big tnum">' + money(total) + '</div>'

        ? money(target) + ' across ' + goals.length + ' goal' + (goals.length===1?'':'s')
        : 'across ' + goals.length + ' goal' + (goals.length===1?'':'s')) + '</div>'
    + (target > 0 ? '<div class="bar"><i style="width:' + clamp(Math.round(total/target*100),0,100) + '%"></i></div>'
        + '<div class="legend"><span>' + clamp(Math.round(total/target*100),0,999) + '% of all targets</span>'
        + '<span>' + money(Calc.savedIn(mk) - Calc.savedOut(mk), {sign:true}) + ' in ' + esc(monthLabel(mk,{month:'short'})) + '</span></div>' : '')
    + '</section>'));

  if (!goals.length && !archived.length){
    const card = h('<div class="card" style="margin-top:16px"></div>');
    card.appendChild(emptyState('🎯','No savings goals yet',
      'A goal is a pot you move money into. Deposits are not counted as spending, so your budget stays honest.',
      'Create your first goal', () => editGoal(null)));
    c.appendChild(card);
  } else {
    const sec = h('<section class="section"><div class="rows"></div></section>');
    const rows = sec.querySelector('.rows');
    goals.forEach(g => rows.appendChild(goalCard(g)));
    c.appendChild(sec);
  }

  if (archived.length){
    const sec = h('<section class="section"><div class="section-hd"><h2>Archived</h2></div><div class="rows"></div></section>');
    const rows = sec.querySelector('.rows');
    archived.forEach(g => {
      const r = h('<button class="row"><span class="icon" style="background:var(--track)">' + esc(g.icon) + '</span>'
        + '<span class="body"><span class="t muted">' + esc(g.name) + '</span>'
        + '<span class="s">' + fmtMoney(Calc.goalBalance(g.id)) + ' · archived</span></span>'
        + '<span class="chev">' + ico('chevR',17) + '</span></button>');
      r.onclick = () => openGoalDetail(g.id);
      rows.appendChild(r);
    });
    c.appendChild(sec);
  }

  wrap.appendChild(c);
  return wrap;
}

function goalCard(g){
  const bal = Calc.goalBalance(g.id);
  const pct = g.targetMinor > 0 ? clamp(Math.round(bal/g.targetMinor*100), 0, 999) : 0;
  const done = g.targetMinor > 0 && bal >= g.targetMinor;
  const left = Math.max(0, g.targetMinor - bal);
  let eta = '';
  if (g.targetDate && !done){
    const days = Math.round((isoToDate(g.targetDate) - isoToDate(todayISO())) / 86400000);
    const months = Math.max(0, Math.round(days / 30.4));
    eta = days < 0 ? 'Target date passed'
        : months <= 1 ? 'Target ' + shortDate(g.targetDate)
        : Math.round(left / months) > 0 ? fmtMoney(Math.round(left/months)) + '/month to reach it' : '';
  }
  const row = h('<button class="row" style="align-items:flex-start;padding:14px">'
    + '<span class="icon lg" style="background:' + softOf(g.color) + '">' + esc(g.icon) + '</span>'
    + '<span class="body">'
      + '<span style="display:flex;align-items:center;gap:8px"><span class="t" style="flex:1">' + esc(g.name) + '</span>'
      + (done ? '<span class="pill ok">Reached</span>' : '<span class="tnum" style="font-size:13px;font-weight:700;color:' + colorOf(g.color) + '">' + pct + '%</span>') + '</span>'
      + '<span class="bar thin"><i style="width:' + clamp(pct,0,100) + '%;background:' + colorOf(g.color) + '"></i></span>'
      + '<span class="s tnum">' + money(bal) + ' of ' + money(g.targetMinor)
      + (left > 0 ? ' · ' + (state.settings.hideAmounts ? '•••' : fmtMoney(left) + ' to go') : '') + '</span>'
      + (eta ? '<span class="s">' + esc(eta) + '</span>' : '')
    + '</span></button>');
  row.onclick = () => openGoalDetail(g.id);
  return row;
}

function openGoalDetail(goalId){
  const g = goalById(goalId);
  if (!g) return;
  sheet({
    title: g.name, left:'Done',
    build(s){
      const draw = () => {
        const goal = goalById(goalId);
        if (!goal){ s.close(); return; }
        const bal = Calc.goalBalance(goal.id);
        const pct = goal.targetMinor > 0 ? clamp(Math.round(bal/goal.targetMinor*100),0,999) : 0;
        const done = goal.targetMinor > 0 && bal >= goal.targetMinor;
        const left = Math.max(0, goal.targetMinor - bal);
        const hist = state.transactions.filter(t => t.goalId === goal.id).sort(sortTx);

        s.body.innerHTML =
          '<div class="card hero" style="text-align:center">'

function editGoal(goalId){

  const draft = existing
    ? Object.assign({}, existing)
    : {id:uid(), name:'', targetMinor:0, targetDate:null, icon:'🎯', color:'blue', isArchived:false, createdAt:Date.now()};

  sheet({
    title: existing ? 'Edit goal' : 'New savings goal',
    left:'Cancel', right:'Save',
    build(s){
      const validate = () => s.setRight('Save', draft.name.trim().length > 0 && draft.targetMinor > 0);
      s.body.innerHTML =
        amountFieldHTML('tgt', draft.targetMinor ? moneyInput(draft.targetMinor) : '',
          '<div style="font-size:13px;color:var(--text-2);font-weight:600">TARGET AMOUNT</div>')
        + '<div class="form-group" style="margin-top:14px">'
          + '<label class="fr"><span class="lab">Name</span><input id="nm" type="text" placeholder="Holiday, Emergency fund…" value="' + esc(draft.name) + '" maxlength="40"></label>'
          + '<label class="fr"><span class="lab">Target date</span><input id="td" type="date" value="' + esc(draft.targetDate || '') + '" style="text-align:right"></label>'
        + '</div>'
        + '<div class="group-note">A target date is optional — it only powers the "per month to reach it" hint.</div>'
        + '<div class="form-group"><div class="fr col"><span class="lab">COLOR</span><div class="swatches" id="sw"></div></div>'
        + '<div class="fr col"><span class="lab">ICON</span><div class="emoji-grid" id="eg"></div></div></div>';

      const tgt = s.body.querySelector('#tgt'), nm = s.body.querySelector('#nm'), td = s.body.querySelector('#td');
      tgt.id = 'tgt'; autosizeAmount(tgt);
      tgt.oninput = () => { draft.targetMinor = parseMoney(tgt.value) || 0; validate(); };
      nm.oninput = () => { draft.name = nm.value; validate(); };
      td.onchange = () => { draft.targetDate = td.value || null; };

      const sw = s.body.querySelector('#sw');
      PALETTE.forEach(p => {
        const b = h('<button class="sw" aria-selected="' + (p.id === draft.color) + '" aria-label="' + p.id + '"><i style="background:' + (isDark()?p.dark:p.light) + '"></i></button>');

        sw.appendChild(b);

      draft.name = draft.name.trim();
      if (existing) Object.assign(existing, draft);
      else state.goals.push(draft);
      save(true); close(); render(); toast(existing ? 'Goal updated' : 'Goal created');
    }
  });
}

/* ============================================================
   TRANSACTION SHEET — one sheet for all four kinds
   ============================================================ */
function openTxSheet(opts){
  opts = opts || {};
  const editing = opts.edit || null;
  const t = editing
    ? Object.assign({}, editing)
    : {id:uid(), kind:opts.kind || 'expense', amountMinor:0, date: todayISO(),
       categoryId:opts.categoryId || null, goalId:opts.goalId || null,
       title:'', note:'', createdAt:Date.now(), updatedAt:Date.now()};
  let repeatMonthly = false;

  const needsCat  = (k) => k === 'expense' || k === 'income';
  const needsGoal = (k) => k === 'savingsDeposit' || k === 'savingsWithdrawal';

  /* pick a sensible default target */
  const defaults = () => {
    if (needsCat(t.kind) && !catById(t.categoryId)){
      t.categoryId = suggestCategory(t.kind === 'expense' ? 'expense' : 'income');
    }
    if (needsCat(t.kind)) t.goalId = null;
    if (needsGoal(t.kind) && !goalById(t.goalId)){
      const gs = activeGoals();
      t.goalId = gs.length ? gs[0].id : null;
    }
    if (needsGoal(t.kind)) t.categoryId = null;
  };
  defaults();

  const s = sheet({
    title: editing ? 'Edit ' + KIND_META[t.kind].label.toLowerCase() : KIND_META[t.kind].label,
    left:'Cancel', right:'Save',
    build(sh){ draw(sh); },
    onRight(close){ commit(close); }
  });

  function maxWithdrawal(){
    if (t.kind !== 'savingsWithdrawal' || !t.goalId) return null;
    let bal = Calc.goalBalance(t.goalId);
    // when editing an existing withdrawal from the same goal, its own amount is available again
    if (editing && editing.kind === 'savingsWithdrawal' && editing.goalId === t.goalId) bal += editing.amountMinor;
    if (editing && editing.kind === 'savingsDeposit' && editing.goalId === t.goalId) bal -= editing.amountMinor;
    return bal;
  }

  function draw(sh){
    const cat = t.categoryId ? catById(t.categoryId) : null;
    const goal = t.goalId ? goalById(t.goalId) : null;
    const maxW = maxWithdrawal();

    sh.body.innerHTML =
      (editing ? '' :
        '<div class="seg" role="tablist" id="kseg">'
        + ['expense','income','savingsDeposit','savingsWithdrawal'].map(k =>
            '<button role="tab" data-k="' + k + '" aria-selected="' + (t.kind===k) + '">' + KIND_META[k].short + '</button>').join('')
        + '</div>')
      + amountFieldHTML('amt', t.amountMinor ? moneyInput(t.amountMinor) : '')
      + '<div id="amterr" class="err" style="text-align:center;margin:4px 0 10px"></div>'
      + '<div class="form-group">'
        + (needsCat(t.kind)
            ? '<button class="fr" id="pickcat"><span class="lab">Category</span><span class="val">'
              + (cat ? esc(cat.icon + '  ' + cat.name) : '<span style="color:var(--neg)">Choose</span>')
              + '</span><span class="chev">' + ico('chevR',17) + '</span></button>'
            : '<button class="fr" id="pickgoal"><span class="lab">Goal</span><span class="val">'
              + (goal ? esc(goal.icon + '  ' + goal.name) : '<span style="color:var(--neg)">Choose</span>')
              + '</span><span class="chev">' + ico('chevR',17) + '</span></button>')
        + '<label class="fr"><span class="lab">Date</span><input type="date" id="dt" value="' + esc(t.date) + '" style="text-align:right"></label>'
        + '<label class="fr"><span class="lab">Description</span><input type="text" id="ttl" placeholder="Optional" maxlength="60" value="' + esc(t.title || '') + '"></label>'
      + '</div>'
      + (t.kind === 'savingsWithdrawal' && goal
          ? '<div class="group-note">Available in ' + esc(goal.name) + ': <b>' + esc(fmtMoney(maxW || 0)) + '</b>. A goal cannot go below zero.</div>' : '')
      + (t.kind === 'savingsDeposit'
          ? '<div class="group-note">Deposits are <b>not</b> counted as spending — your budget is unaffected.</div>' : '')
      + '<div class="form-group"><div class="fr col"><span class="lab">NOTE</span>'
        + '<textarea id="note" placeholder="Optional" maxlength="400">' + esc(t.note || '') + '</textarea></div></div>'
      + (editing ? '' :
        '<button class="fr form-group" id="rep" style="width:100%"><span class="lab" style="flex:1;min-width:0">Repeat every month</span>'
        + '<span class="switch" aria-checked="' + repeatMonthly + '" role="switch"><i></i></span></button>')
      + (editing
          ? '<button class="btn danger" id="del" style="margin-top:8px">Delete transaction</button>'
          : '');

    /* kind switcher */
    const kseg = sh.body.querySelector('#kseg');
    if (kseg) kseg.querySelectorAll('button').forEach(b => b.onclick = () => {
      t.kind = b.dataset.k; defaults(); haptic();
      sh.setTitle(KIND_META[t.kind].label);
      draw(sh);
    });

    const amt = sh.body.querySelector('#amt');
    amt.oninput = () => {
      const v = parseMoney(amt.value);
      t.amountMinor = v == null ? 0 : Math.abs(v);
      showErr('');
      validate();
    };
    amt.onblur = () => { if (t.amountMinor){ amt.value = moneyInput(t.amountMinor); fitAmt(); } };
    const fitAmt = autosizeAmount(amt);

    const pc = sh.body.querySelector('#pickcat');
    if (pc) pc.onclick = () => {
      const type = t.kind === 'expense' ? 'expense' : 'income';
      const list = catsOf(type).map(c => ({id:c.id, name:c.name, icon:c.icon, color:c.color}));
      pickerSheet('Choose category', list, t.categoryId, (id, act) => {
        if (act === 'new'){ editCategory(null, type, (created) => { t.categoryId = created.id; draw(sh); }); return; }
        if (id){ t.categoryId = id; draw(sh); }
      }, '<button class="btn secondary" data-act="new" style="margin-bottom:14px">+ New category</button>');
    };
    const pg = sh.body.querySelector('#pickgoal');
    if (pg) pg.onclick = () => {
      const list = activeGoals().map(g => ({id:g.id, name:g.name, icon:g.icon, color:g.color,
        sub: fmtMoney(Calc.goalBalance(g.id)) + ' of ' + fmtMoney(g.targetMinor)}));
      pickerSheet('Choose goal', list, t.goalId, (id, act) => {
        if (act === 'new'){ editGoal(null); return; }
        if (id){ t.goalId = id; draw(sh); }
      }, '<button class="btn secondary" data-act="new" style="margin-bottom:14px">+ New goal</button>');
    };

    sh.body.querySelector('#dt').onchange = (e) => { t.date = e.target.value || todayISO(); };
    sh.body.querySelector('#ttl').oninput = (e) => { t.title = e.target.value; };
    sh.body.querySelector('#note').oninput = (e) => { t.note = e.target.value; };

    const rep = sh.body.querySelector('#rep');
    if (rep) rep.onclick = () => {
      repeatMonthly = !repeatMonthly;
      rep.querySelector('.switch').setAttribute('aria-checked', repeatMonthly);
      haptic();
    };

    const del = sh.body.querySelector('#del');
    if (del) del.onclick = async () => {
      if (await confirmBox('Delete transaction?', 'This removes it permanently.', 'Delete', true)){
        deleteTx(editing.id); sh.close();
      }
    };

    validate();
    if (!editing) setTimeout(() => { try { amt.focus(); } catch(e){} }, 380);

    function showErr(msg){ const e = sh.body.querySelector('#amterr'); if (e) e.textContent = msg; }
    function validate(){
      const ok = t.amountMinor > 0 && (needsCat(t.kind) ? !!t.categoryId : !!t.goalId);
      sh.setRight('Save', ok);
    }
  }

  function commit(close){
    if (t.amountMinor <= 0){ toast('Enter an amount greater than zero'); return; }
    if ((t.kind === 'expense' || t.kind === 'income') && !t.categoryId){ toast('Choose a category'); return; }
    if ((t.kind === 'savingsDeposit' || t.kind === 'savingsWithdrawal') && !t.goalId){ toast('Choose a savings goal'); return; }
    if (t.kind === 'savingsWithdrawal'){
      const max = maxWithdrawal();
      if (t.amountMinor > max){
        alertBox('Not enough in this goal', 'You can withdraw at most ' + fmtMoney(max) + ' from ' + goalById(t.goalId).name + '.');
        return;
      }
    }
    t.title = (t.title || '').trim();
    t.note = (t.note || '').trim();
    t.updatedAt = Date.now();

    if (editing){
      const idx = state.transactions.findIndex(x => x.id === editing.id);
      if (idx > -1) state.transactions[idx] = t;
    } else {
      state.transactions.push(t);
      if (repeatMonthly){
        state.recurring.push({
          id:uid(), kind:t.kind, amountMinor:t.amountMinor, categoryId:t.categoryId, goalId:t.goalId,
          title:t.title, note:t.note, nextDate: addMonthsClamped(t.date, 1), active:true, createdAt:Date.now()
        });
      }
    }
    save(true);
    // follow the user to the month they just posted into
    if (t.date.slice(0,7) !== ui.month) ui.month = t.date.slice(0,7);
    close();
    render();
    haptic(14);
    toast(editing ? 'Saved' : KIND_META[t.kind].label + ' added');
  }
}

let lastDeleted = null;
function deleteTx(id){
  const idx = state.transactions.findIndex(t => t.id === id);
  if (idx < 0) return;
  lastDeleted = state.transactions[idx];
  state.transactions.splice(idx, 1);
  save(true);
  render();
  haptic(18);
  showUndo();
}
function showUndo(){
  let el = $('#toast');
  if (!el){ el = h('<div class="toast" id="toast"></div>'); $('#layers').appendChild(el); }
  el.innerHTML = 'Deleted &nbsp;<b style="color:var(--accent);margin-left:4px">Undo</b>';
  el.style.pointerEvents = 'auto';
  el.onclick = () => {
    if (lastDeleted){ state.transactions.push(lastDeleted); lastDeleted = null; save(true); render(); toast('Restored'); }
  };
  requestAnimationFrame(() => el.classList.add('in'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('in'); el.style.pointerEvents = 'none'; el.onclick = null; }, 4200);
}

/** The category you reach for most often, so the common case is one tap. */
function suggestCategory(type){
  const list = catsOf(type);
  if (!list.length) return null;
  const cutoff = addDays(todayISO(), -60);
  const counts = new Map();
  for (const t of state.transactions){
    if (t.kind !== type || !t.categoryId || t.date < cutoff) continue;
    counts.set(t.categoryId, (counts.get(t.categoryId) || 0) + 1);
  }
  let best = null, bestN = 0;
  counts.forEach((n, id) => {
    const c = catById(id);
    if (c && !c.isArchived && n > bestN){ best = id; bestN = n; }
  });
  return best || list[0].id;
}

                      + plural(gap.count, 'category', 'categories') + ' ' + (gap.count === 1 ? 'has' : 'have') + ' no limit'
                      + (gap.typical
                          ? ', and about <b>' + esc(fmtMoney(gap.typical)) + '</b> a month has been going through '
                            + (gap.count === 1 ? 'it' : 'them') + '. A budget of only ' + esc(fmtMoney(lim.total))

                          : ', though nothing has been spent in ' + (gap.count === 1 ? 'it' : 'them') + ' lately.')
                      + '</div>'
                      + (gap.typical
                          ? '<button class="btn secondary" id="usegap" style="margin-top:10px;padding:11px">Use '

              + '</div>'
            : '<div class="group-note" style="margin-top:18px">Set monthly limits on individual categories in the '
              + '<b>Budget</b> tab and a button will appear here to add them up for you.</div>')
        + (val != null ? '<button class="btn danger" id="clr" style="margin-top:20px">Remove budget for this month</button>' : '');

      const b = s.body.querySelector('#b');
      const fit = autosizeAmount(b);
      b.oninput = () => { const v = parseMoney(b.value); val = v == null ? null : Math.abs(v); s.setRight('Save', true); };
      const fill = (amount) => {
        val = amount;
        b.value = moneyInput(amount);
        fit();
        s.setRight('Save', true);
        haptic(12);
        toast('Amount filled in — tap Save to keep it');
      };
      const ul = s.body.querySelector('#uselim');
      if (ul) ul.onclick = () => fill(lim.total);
      const ug = s.body.querySelector('#usegap');
      if (ug) ug.onclick = () => fill(withGap);
      const clr = s.body.querySelector('#clr');
      if (clr) clr.onclick = () => { delete state.monthlyBudgets[mk]; save(true); s.close(); render(); toast('Budget removed'); };
      setTimeout(() => b.focus(), 380);
    },
    onRight(close){
      if (val == null || val <= 0){ delete state.monthlyBudgets[mk]; }
      else state.monthlyBudgets[mk] = val;
      save(true); close(); render(); toast('Budget saved');
    }
  });
}

        + '<div class="card pad" style="margin-top:16px;display:flex;gap:16px">'

          + '<div class="tnum" style="font-weight:750;font-size:19px">' + esc(fmtMoney(spent)) + '</div></div>'
          + '<div><div style="font-size:12px;color:var(--text-2);font-weight:650;text-align:right">AVG LAST 3 MO</div>'
          + '<div class="tnum" style="font-weight:750;font-size:19px;text-align:right">' + esc(fmtMoney(avg3(cat.id, mk))) + '</div></div></div>'
        + '<div class="group-note" style="margin-top:14px">Limits are stored per month, so changing this does not rewrite past months.</div>'
        + (val != null ? '<button class="btn danger" id="clr">Remove limit</button>' : '');
      const b = s.body.querySelector('#b');
      autosizeAmount(b);
      b.oninput = () => { const v = parseMoney(b.value); val = v == null ? null : Math.abs(v); s.setRight('Save', true); };
      const clr = s.body.querySelector('#clr');
      if (clr) clr.onclick = () => {
        if (state.categoryBudgets[mk]) delete state.categoryBudgets[mk][cat.id];
        save(true); s.close(); render(); toast('Limit removed');
      };
      setTimeout(() => b.focus(), 380);
    },
    onRight(close){
      if (!state.categoryBudgets[mk]) state.categoryBudgets[mk] = {};
      if (val == null || val <= 0) delete state.categoryBudgets[mk][cat.id];
      else state.categoryBudgets[mk][cat.id] = val;
      save(true); close(); render(); toast('Limit saved');
    }
  });
}
function avg3(catId, mk){
  let s = 0;
  for (let i = 1; i <= 3; i++) s += Calc.spentInCat(monthShift(mk, -i), catId);
  return Math.round(s / 3);
}

function checkForUpdate(){
  sheet({
    title:'Version', left:'Done',
    build(s){
      const hosted = location.protocol.startsWith('http');
      s.body.innerHTML =

        + '<div style="font-size:13.5px;color:var(--text-2);margin-top:2px">John Money</div></div>'
        + '<div class="group-note" style="margin-top:16px">Updating replaces the app\'s code only. Your entries, notes, budgets and '
        + 'settings live separately on this device and are never touched by an update.</div>'
        + (hosted
            ? '<button class="btn" id="chk">Check for an update</button>'
              + '<div id="chkmsg" class="group-note" style="margin-top:12px"></div>'
            : '<div class="group-note">This copy was opened from a file rather than a web address, so there is nothing to check against.</div>')
        + '<div class="section-hd" style="margin-top:20px"><h2>Before you update</h2></div>'
        + '<div class="card pad" style="font-size:14px;line-height:1.5;color:var(--text-2)">'
        + '<p style="margin-top:0">Take a backup first — <b style="color:var(--text)">Settings → Export backup file</b>. '
        + 'If an update ever goes wrong, restoring that file puts everything back.</p>'
        + '<p style="margin-bottom:0">Keep using the same web address. A different address is treated as a different app by the '
        + 'phone, with its own separate storage.</p></div>';

      const chk = s.body.querySelector('#chk');
      if (chk) chk.onclick = async () => {
        const msg = s.body.querySelector('#chkmsg');
        msg.textContent = 'Checking…';
        try {
          const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
          if (reg){
            await reg.update();
            if (reg.waiting || reg.installing){
              msg.innerHTML = '<b style="color:var(--text)">An update is ready.</b> Reloading…';
              setTimeout(() => location.reload(), 1200);
              return;
            }
          }
          const res = await fetch(location.href, {cache:'reload'}).catch(() => null);
          msg.textContent = res ? 'You are on the latest version that this address is serving.' : 'Could not reach the server — you may be offline.';
        } catch(e){ msg.textContent = 'Could not check just now.'; }
      };
    }
  });
}
